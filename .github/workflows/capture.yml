name: capture

# Measure the browser on each platform and offer the profiles for download.
#
# Run by hand from the Actions tab. A capture is a measurement of a particular
# browser build, so it belongs in the repository when someone has looked at it
# and decided it is the one to ship — not on every push. Nothing here commits
# anything; the profiles come out as artifacts to be looked at and copied in.
#
# Nothing here names a version either. The version comes from the browser that
# was actually measured, so this workflow captures whatever Chrome is current on
# the day it runs and files it under that name. A workflow that hardcoded
# chrome_151 would file a Chrome 152 capture under 151 the moment Chrome
# updated, and a profile whose name lies about its version is worse than none:
# the name is what `--profile` asks for and what every log shows.
#
# Default captures current stable. A pinned156 run uses original official
# installers whose exact hashes are in verification/chrome156-installers.json.
# What a capture does not measure it inherits from a basis: by default the
# newest shipped profile of its family and platform, or the one policy-from
# names (chrome_156, say, for a pinned156 run that replaces chrome_156).
#
# With gate, nothing is captured: the shipped profile of the browser's major
# (chrome_156 on a pinned156 run, chrome_157 on Chrome 157 Stable) is held to
# the browser as the release's pinned gate holds the newest Chrome to Stable,
# by internal/pinned, and its result is the run's artifact.
on:
  workflow_dispatch:
    inputs:
      browser:
        description: Current stable or original pinned Google Chrome156 installers
        type: choice
        options: [stable, '156']
        default: stable
      os:
        description: Native runners as a JSON list
        type: string
        default: '["macos-latest", "windows-latest", "ubuntu-latest"]'
      fixture:
        description: Fixture group for a focused rerun; all preserves the complete acceptance
        type: choice
        options: [all, requests, connections, decoding, hpack, records, alps, flow, urls, hellos, false-start]
        default: all
      only:
        description: Exact comma-separated scenario IDs for a focused rerun
        type: string
        default: ''
      h3:
        description: Collect paired native H3/QPACK/GREASE cohorts with private original evidence
        type: boolean
        default: false
      fixtures:
        description: Run the complete existing fixture acceptance (independent of H3 collection)
        type: boolean
        default: true
      evidence-certificate:
        description: Base64 PEM public certificate for private raw evidence (required for pinned156)
        type: string
        default: ''
      policy-from:
        description: Profile whose unmeasured policies the capture inherits (default the newest shipped)
        type: string
        default: ''
      release-auth-oracle:
        description: Only record the two Windows release-auth oracle cohorts; no profile capture or fixture promotion
        type: boolean
        default: false
      gate:
        description: Capture nothing; hold the shipped profile of the browser's major to it, as the release's pinned gate does
        type: boolean
        default: false
      net-log:
        description: With gate, every launch of the browser writes a net log, kept only in the encrypted evidence
        type: boolean
        default: false
  # Callable, so the drift check can measure without a second copy of all this.
  # Artifacts belong to the run rather than to the workflow, so whatever calls
  # this can download what it produced.
  workflow_call:
    inputs:
      browser:
        description: stable or156
        type: string
        default: stable
      os:
        description: Native runners as a JSON list
        type: string
        default: '["macos-latest", "windows-latest", "ubuntu-latest"]'
      fixture:
        description: all or one existing fixture group
        type: string
        default: all
      only:
        description: Exact scenario IDs for a focused rerun
        type: string
        default: ''
      h3:
        description: Collect native H3 cohorts
        type: boolean
        default: false
      fixtures:
        description: Run existing full fixtures
        type: boolean
        default: true
      evidence-certificate:
        description: Base64 PEM public certificate for private raw evidence
        type: string
        default: ''
      policy-from:
        description: Profile whose unmeasured policies the capture inherits
        type: string
        default: ''
      release-auth-oracle:
        description: Only record the two Windows release-auth oracle cohorts
        type: boolean
        default: false
      gate:
        description: Capture nothing; hold the shipped profile of the browser's major to it
        type: boolean
        default: false
      net-log:
        description: With gate, every launch of the browser writes a net log, kept only in the encrypted evidence
        type: boolean
        default: false
    outputs:
      profile:
        description: the name the capture was filed under, e.g. chrome_152_linux
        value: ${{ jobs.capture.outputs.profile }}

permissions:
  contents: read

jobs:
  release-auth-oracle:
    if: inputs.release-auth-oracle
    uses: ./.github/workflows/release-oracle.yml
    with:
      evidence-certificate: ${{ inputs.evidence-certificate }}

  capture:
    if: ${{ !inputs.release-auth-oracle }}
    timeout-minutes: 180
    outputs:
      profile: ${{ steps.captured.outputs.name }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os || '["macos-latest", "windows-latest", "ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      # Hosted Windows runners otherwise encode redirected Python output with
      # the active ANSI code page. GitHub output and summary files are UTF-8,
      # so even punctuation such as an em dash is corrupted on the way from
      # served.txt into a step output and can make the summary fail to print.
      PYTHONUTF8: '1'
      CAPTURE_BROWSER: ${{ inputs.browser || 'stable' }}
      EVIDENCE_CERTIFICATE: ${{ inputs.evidence-certificate }}
      GATE: ${{ inputs.gate }}
      POLICY_FROM: ${{ inputs.policy-from }}
      # Chrome's sandbox does not work on a hosted runner and fails silently:
      # the browser starts, never loads the page, and the capture times out
      # having watched something that was never going to answer. Ubuntu 24.04
      # restricts the unprivileged user namespaces the sandbox is built on, and
      # the Windows runner denies the sandbox access to the executable, which
      # was in the log verbatim. Process isolation is neither TLS nor a header,
      # so the capture is the same capture.
      FLAGS: --browser-arg=--no-sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Not for the project — nothing here is Python — but because both the
      # step that reads the capture and the one that writes the summary use it,
      # and `python3` is not on PATH in Git Bash on the Windows runner.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: obtain pinned installer when requested
        id: archive
        shell: bash
        run: |
          case "$CAPTURE_BROWSER" in
            stable) ;;
            156) [ -n "$EVIDENCE_CERTIFICATE" ] || [ "$GATE" = true ] || { echo "pinned156 requires a public evidence certificate"; exit 1; }
                 python3 scripts/chrome-archive.py --manifest verification/chrome156-installers.json \
                   --platform "$RUNNER_OS" --output "$RUNNER_TEMP/chrome156" >> "$GITHUB_OUTPUT" ;;
            *) echo "unsupported browser selection"; exit 1 ;;
          esac
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.h3 || inputs.fixture == 'alps'
        with:
          node-version: '24.16.0'
      # Google Chrome, not Chrome for Testing.
      #
      # `browser-actions/setup-chrome` installs Chrome for Testing, which for
      # this purpose is a different browser. Measured, same version and same
      # machine, headless both times:
      #
      #   Chrome for Testing  sec-ch-ua: "Chromium";v="151", "Not=A?Brand";v="99"
      #   Google Chrome       sec-ch-ua: "Not=A?Brand";v="99", "Google Chrome";v="151", …
      #
      # It says Chromium, on every request, and no flag changes that — the
      # branding is compiled in. Its TLS can be brought into line with
      # --disable-field-trial-config, which it needs because it also turns on
      # the testing field-trial config; but a profile is the whole request, and
      # half a browser is not one.
      #
      # The cost is that the version cannot be chosen: Google serves the current
      # stable and nothing else. The run reports which one it got and how that
      # compares to what is being served, which is the part that matters.
      # Straight from Google on every platform, and never a copy that is already
      # there.
      #
      # A runner image is built every few weeks and everything in it is frozen
      # at that moment: Homebrew's cask metadata, Chocolatey's, the preinstalled
      # browsers. `brew install --cask google-chrome` on a macOS runner
      # installed Chrome 150 while Google was serving 151.0.7922.138 and the
      # cask itself pointed at 151 — the runner's snapshot of the cask was the
      # old one. Measuring a browser two releases behind is measuring the wrong
      # browser, quietly.
      #
      # dl.google.com always has the current stable, which is the whole point.
      #
      # On macOS the browser is a copy of its own under RUNNER_TEMP, and
      # nothing can write to it. The image's Google Chrome in /Applications
      # was updated while it was in use, by Google's updater as it seems. Run
      # 42927449883 (2026-11-11, image macos-26-arm64 20261102.0473.1, whose
      # Chrome is 156.0.8078.80) copied the pinned 156.0.8078.80 over it;
      # `--version` said 156.0.8078.80 and the comparison matched, and 18 s
      # later the bench's first browser sent Chrome 157's brands
      # (157.0.8103.39, and .40 when the job ran again), in 220 of 228
      # scenarios. On 2026-11-08 the same copy on the same image passed
      # (Google rolls an update out to some of its clients at a time, which
      # would explain it; not checked). No process, root's included, writes,
      # renames or removes a file flagged `uchg` without taking the flag off
      # first, and Chrome runs from such a copy (tried with 157.0.8103.50
      # here, 2026-11-11). The last step holds the copy to the version it was
      # installed with. The image is attached as .github/actions/google-chrome
      # attaches it: hdiutil, else diskutil.
      - name: install Google Chrome (macOS)
        id: mac-chrome
        if: runner.os == 'macOS'
        env:
          ARCHIVE: ${{ steps.archive.outputs.path }}
        run: |
          if [ -z "$ARCHIVE" ]; then
            ARCHIVE="$RUNNER_TEMP/chrome.dmg"
            curl --fail -sL -o "$ARCHIVE" \
              https://dl.google.com/chrome/mac/universal/stable/GGRO/googlechrome.dmg
          fi
          attached=$(hdiutil attach -nobrowse -readonly "$ARCHIVE" ||
            diskutil image attach --mountOptions nobrowse --readOnly "$ARCHIVE")
          mount=$(printf '%s\n' "$attached" | awk -F '\t' '/\/Volumes\// {print $NF}' | tail -n 1)
          app="$RUNNER_TEMP/Google Chrome.app"
          ditto "$mount/Google Chrome.app" "$app"
          hdiutil detach "$mount" || diskutil eject "$mount"
          chflags -R uchg "$app"
          echo "version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" >> "$GITHUB_OUTPUT"

      - name: install Google Chrome (Linux)
        if: runner.os == 'Linux'
        env:
          ARCHIVE: ${{ steps.archive.outputs.path }}
        run: |
          if [ -z "$ARCHIVE" ]; then
            ARCHIVE=/tmp/chrome.deb
            curl --fail -sL -o "$ARCHIVE" \
              https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          fi
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades "$ARCHIVE"

      - name: install Google Chrome (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARCHIVE: ${{ steps.archive.outputs.path }}
        run: |
          if ($env:ARCHIVE) {
            $install = Start-Process $env:ARCHIVE -Wait -PassThru -ArgumentList '--system-level', '--install', '--allow-downgrade', '--silent', '--do-not-launch-chrome'
            if ($install.ExitCode -notin 0, 3010) { throw "pinned Chrome installer exited $($install.ExitCode)" }
            exit 0
          }
          $ProgressPreference = 'SilentlyContinue'
          $msi = "$env:TEMP\chrome.msi"
          Invoke-WebRequest -UseBasicParsing -OutFile $msi `
            -Uri 'https://dl.google.com/tag/s/dl/chrome/install/googlechromestandaloneenterprise64.msi'
          Start-Process msiexec.exe -Wait -ArgumentList '/i', $msi, '/quiet', '/norestart'

      - name: where Chrome is
        id: chrome
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS)   path="$RUNNER_TEMP/Google Chrome.app/Contents/MacOS/Google Chrome" ;;
            Linux)   path="/opt/google/chrome/chrome" ;;
            Windows) path="C:/Program Files/Google/Chrome/Application/chrome.exe" ;;
          esac
          [ -f "$path" ] || { echo "no Google Chrome at $path"; exit 1; }
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "$path"

      # `chrome.exe --version` on Windows does not print a version and exit — it
      # launches the browser. Measured: this step sat for seven minutes emitting
      # Chrome's startup logs before the job was cut off. Windows keeps the
      # version in the file itself, so read it from there and start nothing.
      - name: which browser this is
        id: browser
        shell: bash
        env:
          CHROME: ${{ steps.chrome.outputs.path }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            # shellcheck disable=SC2016 # PowerShell, not Bash, expands $env:CHROME.
            version=$(powershell -NoProfile -Command \
              '(Get-Item $env:CHROME).VersionInfo.ProductVersion')
            version="Google Chrome $version"
          else
            version=$("$CHROME" --version)
          fi
          echo "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$CAPTURE_BROWSER" = 156 ]; then
            python3 - "$version" "$RUNNER_OS" <<'PY'
          import json, sys
          expected = json.load(open('verification/chrome156-installers.json'))['platforms'][sys.argv[2]]['version']
          if sys.argv[1].strip() != 'Google Chrome ' + expected:
              raise SystemExit('pinned browser version mismatch: ' + sys.argv[1])
          PY
          fi

      # What is everybody else running — on this platform.
      #
      # Per platform rather than once for the run, because the answer differs:
      # measured on one day, macOS and Windows were being served 151.0.7922.138
      # with a 0.25% slice already on 152, while Linux was on 151.0.7922.137 and
      # had not been offered 152 at all. One number for all three would be an
      # average of three different situations.
      #
      # "Stable" is not one version: Chrome promotes a major by serving it to a
      # slice of users and widening the slice over days. Which slice this runner
      # landed in decides whether its capture is worth committing.
      - name: what everybody else is running
        id: serving
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS)   platform=$([ "$(uname -m)" = arm64 ] && echo mac_arm64 || echo mac) ;;
            Linux)   platform=linux ;;
            Windows) platform=win64 ;;
          esac
          version=$(python3 scripts/chrome-version.py --platforms "$platform" 2> served.txt) || true
          cat served.txt
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo 'note<<TLSFORGE_EOF'
            cat served.txt
            echo TLSFORGE_EOF
          } >> "$GITHUB_OUTPUT"

      # Did the runner give us the browser we asked for?
      #
      # Behind the majority means a stale install — a runner image freezes its
      # package metadata for weeks, and that is how a macOS runner produced
      # Chrome 150 while Google was serving 151. Measuring a browser two
      # releases old is measuring the wrong browser, so it stops here.
      #
      # Ahead is different and allowed: it means the runner was handed an early
      # slice of a rollout, which is worth seeing rather than refusing. The
      # summary carries the numbers either way.
      - name: is this the browser most people have
        if: env.CAPTURE_BROWSER == 'stable'
        shell: bash
        env:
          GOT: ${{ steps.browser.outputs.version }}
          MAJORITY: ${{ steps.serving.outputs.version }}
        run: |
          got=$(echo "$GOT" | tr -dc '0-9.' | cut -d. -f1)
          want=$(echo "$MAJORITY" | cut -d. -f1)
          if [ -z "$got" ] || [ -z "$want" ]; then
            echo "could not compare $GOT against $MAJORITY"; exit 1
          fi
          if [ "$got" -lt "$want" ]; then
            echo "installed Chrome $got is behind $want, which is what is being served."
            echo "The runner's copy is stale; this would measure the wrong browser."
            exit 1
          fi
          [ "$got" -gt "$want" ] && echo "note: Chrome $got is ahead of the $want most people run."
          echo "Chrome $got against a served majority of $want"

      # Is a capture even needed? `compare` measures this browser and the
      # shipped profile against the same local instrument and exits non-zero
      # when they differ. Informational, because "they differ" is the reason to
      # be here rather than a reason to stop.
      - name: does the shipped profile still match
        id: shipped
        if: ${{ !inputs.gate }}
        continue-on-error: true
        shell: bash
        run: |
          run() { go run ./cmd/tls-forge compare --color never \
            --browser "${{ steps.chrome.outputs.path }}" "$FLAGS" --timeout 3m; }
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update && sudo apt-get install -y xvfb
            xvfb-run -a bash -c "$(declare -f run); run" | tee shipped.txt
          else
            run | tee shipped.txt
          fi

      - name: capture
        if: ${{ !inputs.gate }}
        shell: bash
        run: |
          mkdir -p captured
          # Headed, under a virtual display on Linux: a headless browser puts
          # "HeadlessChrome" in its user-agent, and a profile announcing that is
          # not the browser anyone is impersonating.
          #
          # No --name. The name is derived from the browser's own user-agent and
          # this machine's platform, which is what makes this workflow measure
          # whatever Chrome is current rather than whatever was written here.
          # The basis by name from the environment, which xvfb-run's shell
          # inherits as it does not an array of this one's.
          run() { go run ./cmd/tls-forge capture \
            --browser "${{ steps.chrome.outputs.path }}" "$FLAGS" ${POLICY_FROM:+--policy-from "$POLICY_FROM"} \
            --json --save captured --provenance-dir captured-provenance --timeout 3m > capture-raw.json; }
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a bash -c "$(declare -f run); run"
          else
            run
          fi
          python3 -c 'import json; json.load(open("capture-raw.json"))'

      # Where the capture landed, read off the disk rather than assumed. The
      # layout is a directory per version holding one file per platform, and the
      # version in it is the browser's, which is the whole point.
      - name: what was captured
        id: captured
        if: ${{ !inputs.gate }}
        shell: bash
        run: |
          file=$(find captured -name '*.json' | head -1)
          if [ -z "$file" ]; then echo "nothing was written"; exit 1; fi
          name=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['name'])" "$file")
          {
            echo "file=$file"
            echo "name=$name"
            echo "path=${file#captured/}"
            echo "version=$(basename "$(dirname "$file")")"
          } >> "$GITHUB_OUTPUT"
          echo "$name at $file"

      # This compares measured TLS/H1/H2 fields only. Unmeasured policies remain
      # inherited candidates and need their own native browser/wire acceptance.
      - name: the capture reproduces the browser
        if: ${{ !inputs.gate }}
        shell: bash
        run: |
          run() { go run ./cmd/tls-forge compare \
            --browser "${{ steps.chrome.outputs.path }}" "$FLAGS" \
            --profile "${{ steps.captured.outputs.file }}" --timeout 3m; }
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a bash -c "$(declare -f run); run"
          else
            run
          fi

      - name: paired native H3 observation
        if: inputs.h3 && !inputs.gate
        shell: bash
        env:
          CHROME: ${{ steps.chrome.outputs.path }}
          PROFILE: ${{ steps.captured.outputs.file }}
        run: |
          [ -n "$EVIDENCE_CERTIFICATE" ] || { echo "H3 raw evidence requires a public encryption certificate"; exit 1; }
          suffix=
          [ "$RUNNER_OS" != Windows ] || suffix=.exe
          peer="$RUNNER_TEMP/a8-h3-peer$suffix"
          go build -o "$peer" scripts/a8-h3-peer.go
          export H3_PEER="$peer"
          run() { python3 scripts/a8-h3-campaign.py --chrome "$CHROME" --peer "$H3_PEER" \
            --profile "$PROFILE" --out private-h3 "$FLAGS" > h3-producer.log 2>&1; }
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends openbox
            xvfb-run -a bash -c "$(declare -f run); openbox --sm-disable > window-manager.log 2>&1 & wm=\$!; trap 'kill \$wm' EXIT; run"
          else
            run
          fi

      - name: fixture acceptance on the native browser
        if: inputs.fixtures != false && !inputs.gate
        shell: bash
        env:
          CHROME: ${{ steps.chrome.outputs.path }}
          FIXTURE: ${{ inputs.fixture || 'all' }}
          ONLY: ${{ inputs.only }}
        run: |
          case "$FIXTURE" in
            all|requests|connections|decoding|hpack|records|alps|flow|urls|hellos|false-start) ;;
            *) echo "unknown fixture group"; exit 1 ;;
          esac
          args=(--browser "$CHROME" "$FLAGS" --check --newer)
          if [ "$RUNNER_OS" = Linux ] && [ "$FIXTURE" = alps ]; then
            export A8_FIXTURE_CHROME="$CHROME"
            export A8_FIXTURE_EVIDENCE="$PWD/fixture-browser"
            args=(--browser "$PWD/scripts/a8-fixture-chrome.mjs" "$FLAGS" --check --newer)
          fi
          if [ "$FIXTURE" != all ]; then
            for name in requests connections decoding hpack records alps flow urls hellos false-start; do
              [ "$name" = "$FIXTURE" ] || args+=("--$name=")
            done
          fi
          [ -z "$ONLY" ] || args+=("--only=$ONLY")
          go run ./internal/harness/measure "${args[@]}" > fixture-differences.txt 2> fixture-measure.log

      # The profile shipped for this browser's major, held to it: the
      # comparison, then every scenario and page on the bench, as the release's
      # pinned gate runs it (release.yml), its fixtures and all. A pinned156
      # browser is an older build of 156 than chrome_156 says it is
      # (verification/chrome156-installers.json against the profile's
      # sec-ch-ua-full-version), and the bench says so where a request carries
      # the build.
      - name: hold the shipped profile to the browser
        if: inputs.gate
        shell: bash
        env:
          CHROME: ${{ steps.chrome.outputs.path }}
          VERSION: ${{ steps.browser.outputs.version }}
          NET_LOG: ${{ inputs.net-log }}
        run: |
          major=$(echo "$VERSION" | tr -dc '0-9.' | cut -d. -f1)
          case "$RUNNER_OS" in
            macOS) platform=macos ;;
            Linux) platform=linux ;;
            Windows) platform=windows ;;
          esac
          requests=testdata/chrome155-requests.json
          [ "$platform" != windows ] || requests=testdata/chrome156-windows-requests.json
          mkdir -p gate
          browser=$CHROME
          if [ "$NET_LOG" = true ]; then
            # Each launch writes a net log of its own (why a page came as a
            # reload, say), kept only in the encrypted evidence.
            [ -n "$EVIDENCE_CERTIFICATE" ] || { echo "a net log needs a public evidence certificate"; exit 1; }
            mkdir -p net-log
            browser=$RUNNER_TEMP/chrome-net-log.sh
            # shellcheck disable=SC2016 # $$, $RANDOM and "$@" are the wrapper's
            printf '#!/bin/bash\nexec "%s" --log-net-log="%s/$$-$RANDOM.json" --net-log-capture-mode=Default "$@"\n' \
              "$CHROME" "$PWD/net-log" > "$browser"
            chmod +x "$browser"
          fi
          gate=(go run ./internal/pinned --browser "$browser" --profile "chrome_$major" --commit "$GITHUB_SHA"
            --requests "$requests" --out "gate/chrome_${major}_$platform.json")
          if [ "$RUNNER_OS" != macOS ]; then gate+=("$FLAGS"); fi
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update && sudo apt-get install -y xvfb
            xvfb-run -a "${gate[@]}"
          else
            "${gate[@]}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && inputs.gate
        with:
          name: gate-${{ runner.os }}
          path: gate/
          if-no-files-found: ignore

      # A third-party opinion, so the profile is not only self-consistent.
      - name: what a third party sees
        if: ${{ !inputs.gate }}
        shell: bash
        run: |
          go run ./cmd/tls-forge fetch \
            --profile "${{ steps.captured.outputs.file }}" \
            --timeout 60s https://tls.browserleaks.com/json > seen.json
          cat seen.json

      # Built in Python from the environment rather than by interpolating
      # `${{ }}` into a shell script. Two reasons, both real: the user-agent and
      # the fingerprints come from a browser and a third-party service, and a
      # value with a quote in it interpolated into bash is a command; and the
      # HTTP/2 fingerprint is full of `|`, which ends a cell in a Markdown table
      # however many backticks are around it.
      - name: summary
        if: ${{ !inputs.gate }}
        shell: bash
        env:
          PROFILE: ${{ steps.captured.outputs.name }}
          RELATIVE: ${{ steps.captured.outputs.path }}
          VERSION: ${{ steps.captured.outputs.version }}
          BROWSER: ${{ steps.browser.outputs.version }}
          RUNNER: ${{ matrix.os }}
          SERVED: ${{ steps.serving.outputs.note }}
          SHIPPED: ${{ steps.shipped.outcome }}
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, os

          seen = json.load(open("seen.json"))
          def cell(value):
              return "`" + str(value).replace("|", "\\|") + "`"

          shipped = ("yes — this capture may be redundant"
                     if os.environ["SHIPPED"] == "success"
                     else "no — worth committing")
          rows = [
              ("browser", os.environ["BROWSER"]),
              ("runner", os.environ["RUNNER"]),
              ("JA4", cell(seen.get("ja4", ""))),
              ("HTTP/2", cell(seen.get("akamai_text", ""))),
              ("user-agent", cell(seen.get("user_agent", ""))),
              ("shipped profile still matches", shipped),
          ]

          print(f'## {os.environ["PROFILE"]}\n')
          print("| | |\n|---|---|")
          for name, value in rows:
              print(f"| {name} | {value} |")
          # Why this version and not the newest: the reasoning goes in the
          # summary, because "we captured 151 while 152 exists" is a decision
          # somebody will otherwise have to reconstruct.
          # The diff, when there is one. Whether a difference is a browser that
          # moved on or a browser running experiments is the judgement this
          # workflow exists to support, and it cannot be made from a yes/no:
          # "the cipher list gained one" reads very differently from "two
          # extensions nobody has heard of".
          if os.environ["SHIPPED"] != "success" and os.path.exists("shipped.txt"):
              print("\n<details open><summary>what differs from the shipped profile</summary>\n")
              print("```")
              print(open("shipped.txt").read().rstrip())
              print("```")
              print("</details>\n")

          # What everyone else has, next to what was measured. A runner handed
          # a brand-new Chrome would otherwise produce a profile matching half a
          # percent of the world, and nothing on the page would say so.
          print("\n<details><summary>what everybody else is running</summary>\n")
          print("```")
          print(os.environ["SERVED"].rstrip())
          print("```")
          print("</details>\n")
          print("Download the artifact, unzip it, and copy the directory in:\n")
          # mkdir first: a new Chrome means a version directory that does not
          # exist yet, and `cp` into a missing parent fails.
          print("```")
          print(f'mkdir -p profile/data/{os.environ["VERSION"]}')
          print(f'cp {os.environ["RELATIVE"]} profile/data/{os.environ["RELATIVE"]}')
          print("```")
          PY

      # The artifact keeps the directory, so what comes out of the zip is
      # already laid out the way profile/data expects and can be copied in
      # whole rather than filed by hand.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.captured.outputs.name != ''
        with:
          name: ${{ steps.captured.outputs.name }}
          path: captured/
          if-no-files-found: error

      # Separate from runnable profile data; drift keeps this binding intact.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.captured.outputs.name != ''
        with:
          name: capture-provenance_${{ steps.captured.outputs.name }}
          path: captured-provenance/
          if-no-files-found: error

      - name: encrypt private original evidence
        if: always() && env.EVIDENCE_CERTIFICATE != ''
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, platform, subprocess
          pathlib.Path('evidence-recipient.pem').write_bytes(base64.b64decode(os.environ['EVIDENCE_CERTIFICATE'], validate=True))
          files = [p for pattern in ['capture-raw.json', 'fixture-*.txt', 'fixture-*.log', 'shipped.txt', 'h3-producer.log'] for p in pathlib.Path('.').glob(pattern)]
          files += [p for p in pathlib.Path('private-h3').rglob('*') if p.is_file()]
          files += [p for p in pathlib.Path('fixture-browser').rglob('*') if p.is_file()]
          files += [p for p in pathlib.Path('net-log').rglob('*') if p.is_file()]
          record = {'source': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(), 'platform': platform.platform(), 'machine': platform.machine(), 'raw_sha256': {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in files}}
          pathlib.Path('evidence-manifest.json').write_text(json.dumps(record, indent=2)+'\n')
          PY
          python3 - <<'PY'
          import pathlib, tarfile
          with tarfile.open('private-evidence.tar.gz', 'w:gz') as archive:
              for pattern in ['capture-raw.json', 'evidence-manifest.json', 'fixture-*.txt', 'fixture-*.log', 'shipped.txt', 'h3-producer.log', 'private-h3', 'fixture-browser', 'net-log']:
                  for path in pathlib.Path('.').glob(pattern):
                      archive.add(path, arcname=str(path))
          PY
          openssl cms -encrypt -binary -aes-256-cbc -in private-evidence.tar.gz \
            -out private-evidence.cms -outform DER evidence-recipient.pem
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && env.EVIDENCE_CERTIFICATE != ''
        with:
          name: capture-private-${{ runner.os }}
          path: private-evidence.cms
          if-no-files-found: error

      # The browser every step measured is the one the run installed: a copy
      # some program changed under it fails the run, whatever else passed.
      # The flag comes off where macOS lets it, so that the runner can remove
      # RUNNER_TEMP: once a bundle has run, it lets no process without App
      # Management change it, flags included (tried here, 2026-11-11: every
      # one of 1343 files and directories refused). The composite action's
      # Chrome is left in RUNNER_TEMP so too, and its jobs pass.
      - name: Chrome as it was installed (macOS)
        if: always() && steps.mac-chrome.outputs.version != ''
        env:
          INSTALLED: ${{ steps.mac-chrome.outputs.version }}
        run: |
          app="$RUNNER_TEMP/Google Chrome.app"
          now=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          chflags -R nouchg "$app" 2>/dev/null || echo "the copy stays locked: macOS lets this process change no bundle that has run"
          [ "$now" = "$INSTALLED" ] || { echo "Google Chrome $INSTALLED became $now during the run"; exit 1; }
          echo "Google Chrome $now throughout"
