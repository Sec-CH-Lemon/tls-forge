name: fork-regression-gates

# Eight macOS jobs of up to 40 minutes: they run when what they gate changes,
# the fork pins in go.mod and go.sum, the inventory or the gate, and by hand.
on:
  push:
    branches: [main, development]
    paths:
      - go.mod
      - go.sum
      - verification/**
      - scripts/fork_gate.py
  pull_request:
    branches: [main, development]
    paths:
      - go.mod
      - go.sum
      - verification/**
      - scripts/fork_gate.py
  workflow_dispatch:
    inputs:
      forks:
        description: Exact fork names as a JSON list for a diagnostic rerun
        type: string
        default: '["utls", "fhttp", "tls-client", "quic-go-utls"]'
      graphs:
        description: Exact module graphs as a JSON list
        type: string
        default: '["standalone", "production"]'
      evidence-certificate:
        description: Base64 PEM public certificate for encrypted private gate evidence
        type: string
        default: ''

concurrency:
  group: forks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fork:
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        fork: ${{ fromJSON(inputs.forks || '["utls", "fhttp", "tls-client", "quic-go-utls"]') }}
        graph: ${{ fromJSON(inputs.graphs || '["standalone", "production"]') }}
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify gate negative controls
        run: python3 -m unittest discover -s scripts -p test_fork_gate.py
      - name: Checkout exact inventory commit
        env:
          FORK: ${{ matrix.fork }}
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          from pathlib import Path
          row = json.loads(Path('verification/fork-failures.json').read_text())['forks'][os.environ['FORK']]
          subprocess.run(['git', 'init', 'fork-source'], check=True)
          subprocess.run(['git', '-C', 'fork-source', 'fetch', '--depth=1', row['repository'], row['commit']], check=True)
          subprocess.run(['git', '-C', 'fork-source', 'checkout', '--detach', 'FETCH_HEAD'], check=True)
          PYCODE
      # The raw evidence the gate writes (test JSONL and stderr, the source
      # archive, module graphs, result.json) stays on the runner, private as
      # verification/README.md asks, which an artifact of a public repository
      # is not. The job's log has the gate's summary line.
      - name: Full suite with named old failures only
        env:
          FORK: ${{ matrix.fork }}
          GRAPH: ${{ matrix.graph }}
        run: python3 scripts/fork_gate.py --fork "$FORK" --graph "$GRAPH" --source fork-source --output fork-results
      - name: Encrypt private gate evidence when explicitly requested
        if: always() && inputs.evidence-certificate != ''
        env:
          EVIDENCE_CERTIFICATE: ${{ inputs.evidence-certificate }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, tarfile
          pathlib.Path('evidence-recipient.pem').write_bytes(base64.b64decode(os.environ['EVIDENCE_CERTIFICATE'], validate=True))
          if not pathlib.Path('fork-results').is_dir():
              raise RuntimeError('gate produced no private evidence')
          with tarfile.open('fork-private.tar.gz', 'w:gz') as archive:
              archive.add('fork-results', arcname='fork-results')
          PY
          openssl cms -encrypt -binary -aes-256-cbc -in fork-private.tar.gz \
            -out fork-private.cms -outform DER evidence-recipient.pem
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && inputs.evidence-certificate != ''
        with:
          name: fork-private-${{ matrix.fork }}-${{ matrix.graph }}
          path: fork-private.cms
          if-no-files-found: error
