name: website

# One Pages artifact owns the apex site and /docs/. Documentation updates use
# the last approved landing-v tag's static landing source, so a branch push
# cannot publish an unapproved landing edit.
on:
  # A push to development runs nothing (owner, 2026-11-05): documentation from
  # development is published by hand (workflow_dispatch on the branch), with
  # the latest tagged landing source; a landing-v tag publishes its own.
  push:
    tags: ['landing-v*']
  workflow_dispatch:
  pull_request:
    branches: [development]
    paths:
      - docs/**
      - mkdocs.yml
      - docs-requirements.txt
      - scripts/generate-docs.py
      - scripts/check-docs-html-links.py
      - '**/*.go'
      - engine/version.json
      - profile/data/**
      - node/src/**
      - node/scripts/compile.ts
      - node/tsconfig*.json
      - node/package*.json
      - python/src/tlsforge/**
      - web/landing/**
      - .github/workflows/landing.yml

concurrency:
  group: tls-forge-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: ./.github/actions/google-chrome
      - name: Install documentation builder and Lighthouse
        run: |
          python -m pip install --requirement docs-requirements.txt
          # The Node.js reference is read from what tsc emits of node/src.
          npm ci --ignore-scripts --prefix node
          npm install --prefix "$RUNNER_TEMP/lighthouse" --no-audit --no-fund lighthouse@13.6.0
      - name: Generate references and build documentation
        run: |
          python scripts/generate-docs.py --write
          mkdocs build --strict --clean --site-dir "$RUNNER_TEMP/generated-docs"
          python scripts/check-docs-html-links.py "$RUNNER_TEMP/generated-docs"
      - name: Assemble the approved site
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/tls-forge-site"
          mkdir -p "$site/docs"
          if [[ "$GITHUB_EVENT_NAME" != pull_request && "$GITHUB_REF_TYPE" == branch ]]; then
            approved=$(git tag --list 'landing-v*' --sort=-version:refname | head -n 1)
            if [[ -z "$approved" ]]; then
              echo 'A landing-v tag is required before documentation can publish at the apex.' >&2
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/approved-landing"
            git archive "$approved" web/landing | tar -x -C "$RUNNER_TEMP/approved-landing"
            cp -R "$RUNNER_TEMP/approved-landing/web/landing/." "$site/"
          else
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then
              git fetch --no-tags origin development
              if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
                echo 'A landing-v tag must point to a development commit.' >&2
                exit 1
              fi
            fi
            cp -R web/landing/. "$site/"
          fi
          cp -R "$RUNNER_TEMP/generated-docs/." "$site/docs/"
          test -f "$site/index.html"
          test -f "$site/docs/index.html"
      - name: Audit landing on mobile and desktop
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/tls-forge-site" > "$RUNNER_TEMP/website-http.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=false
          for ((attempt=0; attempt<50; attempt++)); do
            if curl --fail --silent http://127.0.0.1:8765/ -o /dev/null; then
              ready=true
              break
            fi
            sleep 0.1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/website-http.log"
            exit 1
          fi
          export CHROME_PATH="$CHROME"
          lighthouse="$RUNNER_TEMP/lighthouse/node_modules/lighthouse/cli/index.js"
          node "$lighthouse" http://127.0.0.1:8765/ \
            --chrome-flags='--headless --no-sandbox' \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output-path="$RUNNER_TEMP/landing-mobile.json" --quiet
          node "$lighthouse" http://127.0.0.1:8765/ \
            --preset=desktop --chrome-flags='--headless --no-sandbox' \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output-path="$RUNNER_TEMP/landing-desktop.json" --quiet
          node - "$RUNNER_TEMP/landing-mobile.json" "$RUNNER_TEMP/landing-desktop.json" <<'NODE'
          const fs = require('node:fs');
          for (const file of process.argv.slice(2)) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const scores = Object.fromEntries(
              ['performance', 'accessibility', 'best-practices', 'seo']
                .map(name => [name, Math.round(report.categories[name].score * 100)])
            );
            console.log(file, scores);
            if (Object.values(scores).some(score => score !== 100)) process.exitCode = 1;
          }
          NODE
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: ${{ runner.temp }}/tls-forge-site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-and-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
