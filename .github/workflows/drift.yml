name: drift

# Is the shipped profile still the browser people are running?
#
# This is the one thing in the repository that breaks on its own. Chrome ships a
# new major every few weeks, the handshake moves with it, and nothing here
# changes — so the profile quietly stops being an impersonation and the first
# sign is somebody's scraper collecting challenge pages. Every other check
# answers a question about the code; this one answers a question about the
# world, so it has to be asked on a timer rather than on a push.
#
# When the answer is no it measures the browser and opens a pull request with
# the profile it produced, so the work waiting for a person is reading a diff
# rather than remembering to run something. When the answer is yes it says
# nothing at all: a check that reports every week is a check nobody reads.
#
# It does not merge. A profile is a measurement, and a measurement that nobody
# looked at is how a fingerprint nobody sends ends up shipping — which has
# already happened once here, with Chrome for Testing.
#
# The behaviour job asks the larger half of the same question: does a real
# Chrome, Stable and Beta, on macOS, Linux and Windows, still do everything the
# bench's fixtures say, which tls-forge is held to? It files an issue when it
# does not; a change of behaviour wants code, and no measurement can propose
# that.
on:
  schedule:
    # Mondays, early. Chrome's stable rollouts start midweek, so a Monday run
    # sees a settled picture rather than the first hour of one.
    - cron: '17 6 * * 1'
  # By hand, each half on its own, and a behaviour that differs filed only when
  # asked: a run to see what a change does should not open issues for it.
  workflow_dispatch:
    inputs:
      profile:
        description: Compare the shipped profile with Chrome Stable, and propose one when it drifted
        type: boolean
        default: true
      behaviour:
        description: Hold Chrome Stable and Beta to every fixture of the bench, on macOS, Linux and Windows
        type: boolean
        default: true
      file:
        description: File an issue for each behaviour that differs, as a scheduled run does
        type: boolean
        default: false

permissions:
  contents: write        # push the branch the pull request is for
  pull-requests: write
  issues: write          # the fallback, for a drift that could not be measured

jobs:
  check:
    if: github.event_name == 'schedule' || inputs.profile
    timeout-minutes: 30
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.compare.outputs.verdict }}
      shipped: ${{ steps.shipped.outputs.major }}
      serving: ${{ steps.serving.outputs.version }}
      serving_major: ${{ steps.serving.outputs.major }}
    env:
      # Chrome's sandbox does not work on a hosted runner and fails silently.
      # Process isolation is neither TLS nor a header, so the comparison is the
      # same comparison. See the capture workflow for the measurement.
      FLAGS: --browser-arg=--no-sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # Google Chrome, not Chrome for Testing, and not whatever the image was
      # built with. Both would answer a different question — see the capture
      # workflow, where the same two mistakes are spelled out.
      - name: install Google Chrome
        run: |
          curl -sL -o /tmp/chrome.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/chrome.deb xvfb
          google-chrome --version

      - name: what everybody else is running
        id: serving
        run: |
          version=$(python3 scripts/chrome-version.py --platforms linux)
          if [ -z "$version" ]; then
            echo "Chrome version lookup returned an empty version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"

      - name: what is shipped
        id: shipped
        run: |
          # The directory names are the versions, so the newest is the newest
          # major among them. Read off the tree rather than out of the binary:
          # this is asking what the repository ships, not what a run would wear.
          #
          # A glob rather than `ls`, whose output depends on how the shell it
          # runs in is configured — a developer with `ls -F` gets `chrome_151/`
          # and a pattern anchored on the digits then matches nothing, which
          # produced "chrome_" here before anybody looked. And `-gt` rather than
          # sort, so that 9 is not newer than 152.
          major=
          for dir in profile/data/chrome_*/; do
            name=${dir%/}; name=${name##*/}; n=${name#chrome_}
            case $n in ""|*[!0-9]*) continue ;; esac
            if [ -z "$major" ] || [ "$n" -gt "$major" ]; then major=$n; fi
          done
          if [ -z "$major" ]; then echo "no chrome_<major> in profile/data"; exit 1; fi
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "chrome_$major"

      # The authoritative half. A version number moving is a hint; the
      # handshake differing is the fact — Chrome can ship a new major without
      # touching its ClientHello, and has.
      #
      # Three outcomes, and they must not be confused: 0 the profile still
      # matches, 3 it does not, anything else the check itself broke. They
      # shared an exit code until this workflow needed the difference.
      - name: does the shipped profile still match a real Chrome
        id: compare
        run: |
          # `go run` turns any non-zero program status into its own exit code 1
          # after printing "exit status N". Execute the built command directly
          # so status 3 remains distinguishable from an operational failure.
          go build -o "$RUNNER_TEMP/tls-forge" ./cmd/tls-forge
          set +e
          xvfb-run -a "$RUNNER_TEMP/tls-forge" compare --color never "$FLAGS" \
            --timeout 3m > compare.txt 2>&1
          code=$?
          set -e
          cat compare.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case $code in
            0) echo "verdict=matches" >> "$GITHUB_OUTPUT" ;;
            3) echo "verdict=drifted" >> "$GITHUB_OUTPUT" ;;
            *) echo "the comparison could not be made; failing rather than"
               echo "reporting a browser that would not start as a drifted profile."
               exit 1 ;;
          esac

      # The diff travels to the pull request, which is where somebody will read
      # it, rather than being left in a log nobody opens.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.compare.outputs.verdict == 'drifted'
        with:
          name: drift-diff
          path: compare.txt

      - name: summary
        if: always()
        env:
          VERDICT: ${{ steps.compare.outputs.verdict }}
          SHIPPED: ${{ steps.shipped.outputs.major }}
          SERVING: ${{ steps.serving.outputs.version }}
        run: |
          {
            echo "| | |"
            echo "|---|---|"
            echo "| shipped | chrome_$SHIPPED |"
            echo "| being served | $SERVING |"
            echo "| verdict | ${VERDICT:-the check could not run} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Measure it. The same workflow the Actions tab runs by hand, called rather
  # than copied: it already knows that a runner needs --no-sandbox, that Chrome
  # for Testing is a different browser, and that the version being served is not
  # the newest one published. A second copy of that would drift from the first.
  capture:
    needs: check
    if: needs.check.outputs.verdict == 'drifted'
    uses: ./.github/workflows/capture.yml
    permissions:
      contents: read

  # Open the pull request, with whatever the capture produced.
  propose:
    needs: [check, capture]
    if: always() && needs.check.outputs.verdict == 'drifted'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      # One branch per version, so a second run finds its own branch and adds
      # nothing rather than opening a pull request a week.
      - name: is there already one
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: profile/chrome-${{ needs.check.outputs.serving_major }}
        run: |
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          if gh pr list --state open --head "$BRANCH" --json number --jq '.[].number' | grep -q .; then
            echo "open=yes" >> "$GITHUB_OUTPUT"
            echo "a pull request for $BRANCH is already open"
          else
            echo "open=no" >> "$GITHUB_OUTPUT"
          fi

      # A capture that failed on every platform leaves nothing to propose, and
      # an empty pull request is worse than none: it looks like work that has
      # been done.
      - name: collect the profiles
        id: collected
        if: steps.existing.outputs.open == 'no'
        run: |
          found=0
          measured=
          while IFS= read -r -d '' file; do
            version=$(basename "$(dirname "$file")")
            platform=$(basename "$file")
            mkdir -p "profile/data/$version"
            cp "$file" "profile/data/$version/$platform"
            echo "  $version/$platform"
            measured="$measured $version/$platform"
            found=$((found + 1))
          done < <(find artifacts -name '*.json' -path '*chrome_*' -print0)
          echo "count=$found" >> "$GITHUB_OUTPUT"
          # What this run measured, not what the directory holds: listing the
          # directory would name every profile ever committed and claim this run
          # had produced them.
          echo "platforms=${measured# }" >> "$GITHUB_OUTPUT"

      - name: the profiles load and produce the browser's handshake
        if: steps.collected.outputs.count != '0' && steps.existing.outputs.open == 'no'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Proved before it is proposed. A profile utls cannot load, or one whose
      # JA4 is not the browser's, is a pull request that wastes somebody's
      # afternoon — and both have happened here.
      - name: check what was captured
        if: steps.collected.outputs.count != '0' && steps.existing.outputs.open == 'no'
        run: |
          go build ./...
          for file in profile/data/chrome_*/*.json; do
            name=$(basename "$(dirname "$file")")_$(basename "$file" .json)
            go run ./cmd/tls-forge fetch --profile "$file" \
              --timeout 60s https://tls.browserleaks.com/json > seen.json
            ja4=$(python3 -c "import json;print(json.load(open('seen.json'))['ja4'])")
            echo "  $name  $ja4"
          done

      # PROFILE_PR_TOKEN if it is there, the workflow's own token otherwise.
      #
      # Not a preference: a pull request opened with GITHUB_TOKEN does not start
      # the other workflows, by design, so that automation cannot trigger itself
      # in a loop. The consequence here is a pull request with no checks on it,
      # which for a change to a profile is most of what you would want to see. A
      # fine-grained token with contents and pull-requests write on this
      # repository fixes it; without one this still works, and the checks have to
      # be started by pushing to the branch or closing and reopening.
      - name: open it
        if: steps.collected.outputs.count != '0' && steps.existing.outputs.open == 'no'
        env:
          GH_TOKEN: ${{ secrets.PROFILE_PR_TOKEN || github.token }}
          BRANCH: ${{ steps.existing.outputs.branch }}
          SHIPPED: ${{ needs.check.outputs.shipped }}
          SERVING: ${{ needs.check.outputs.serving }}
          SERVING_MAJOR: ${{ needs.check.outputs.serving_major }}
          PLATFORMS: ${{ steps.collected.outputs.platforms }}
          REVIEWER: ${{ vars.PROFILE_REVIEWER }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add profile/data
          git commit -m "Measure Chrome $SERVING_MAJOR"
          # Forced, because a closed pull request leaves its branch behind and
          # the next measurement of the same Chrome should replace it rather
          # than fail. Nothing but this job ever writes to profile/* branches.
          git push --force --set-upstream origin "$BRANCH"

          {
            echo "The shipped profile stopped matching a real Chrome, so this is a"
            echo "fresh measurement of it, taken on a runner."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| was shipping | chrome_$SHIPPED |"
            echo "| being served | $SERVING |"
            echo "| measured | $PLATFORMS |"
            echo
            echo "Each profile here was loaded and used to fetch a page before this"
            echo "was opened, and the JA4 it produced is in the run's log."
            echo
            echo "**Read it before merging.** A profile is a measurement, and the way"
            echo "a fingerprint nobody sends ends up shipping is that nobody looked:"
            echo "check that the platforms you expect are all here, that the"
            echo "user-agents say Google Chrome rather than Chromium, and ideally run"
            # shellcheck disable=SC2016 # The backticks are Markdown, not shell expansion.
            echo '`tls-forge compare --profile <the file>` against your own browser.'
            echo
            if [ -f artifacts/drift-diff/compare.txt ]; then
              echo '<details><summary>what had drifted</summary>'
              echo
              echo '```'
              cat artifacts/drift-diff/compare.txt
              echo '```'
              echo '</details>'
            fi
          } > body.md

          # The label is a nicety and may not exist in the repository yet; a
          # pull request that opens without it is still the pull request.
          gh pr create --title "Measure Chrome $SERVING_MAJOR" --body-file body.md \
            --head "$BRANCH" --label drift ||
            gh pr create --title "Measure Chrome $SERVING_MAJOR" --body-file body.md \
              --head "$BRANCH"
          # Assigning is the notification. Tolerated rather than required: a
          # repository variable that nobody set should not fail a pull request
          # that is otherwise fine.
          if [ -n "$REVIEWER" ]; then
            gh pr edit "$BRANCH" --add-assignee "$REVIEWER" || echo "could not assign $REVIEWER"
          fi

      # Drift found and nothing to show for it: say so somewhere a person will
      # see, because silence here is indistinguishable from no drift.
      - name: say it could not be measured
        if: needs.capture.result != 'success' || steps.collected.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          SERVING_MAJOR: ${{ needs.check.outputs.serving_major }}
        run: |
          title="Chrome $SERVING_MAJOR drifted and could not be measured"
          if gh issue list --state open --search "in:title \"$title\"" \
               --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "already filed"; exit 0
          fi
          gh issue create --title "$title" --label drift --body \
            "The weekly check found the shipped profile no longer matches a real
          Chrome, and the capture that should have replaced it did not produce
          anything. The run is at $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."

  # Does a real Chrome still do what the bench's fixtures say it does?
  #
  # The check above answers for the first request's handshake and headers.
  # Most of what tls-forge does as Chrome does is not there: which connection a
  # request goes on, what it sends in every kind of request and after every
  # kind of redirect, how its header blocks go into HPACK, its TLS records,
  # what it makes of ALPS, its WINDOW_UPDATEs, how it reads a URL and a page's
  # charset, the order it draws for its extensions, False Start. Each was
  # measured on one build, on macOS, and tls-forge is held to that; a later
  # build may do any of it otherwise without a version number saying so, and
  # Chrome on Linux and on Windows may do some of it otherwise already: its
  # network stack is one code, but not all of it (Windows answers NTLM and
  # Negotiate through SSPI, for one). So every fixture is measured again on
  # each platform a profile is shipped for, on Stable, which people run, and
  # on Beta, which they will run in a few weeks.
  #
  # --newer: what a build's version and platform decide, sec-ch-ua and its
  # kind and the length they give an HTTP/1.1 head, is held to what the
  # browser sends itself. Those are the profile's, which the check above deals
  # with; here they would make every request a difference.
  #
  # A difference is measured again before it is filed: a bench run on a shared
  # runner can be slow where Chrome's own timers are not, and a difference
  # that does not repeat is not reported. One issue for each platform, channel
  # and major, commented on when what differs changes and not otherwise.
  behaviour:
    if: github.event_name == 'schedule' || inputs.behaviour
    timeout-minutes: 180
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        channel: [stable, beta]
    defaults:
      run:
        shell: bash
    env:
      CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # From Google, not the image's, whose Chrome is whatever build the image
      # was made with, and only Stable. Each step says where the browser is
      # (CHROME) and what it says it is (CHROME_VERSION).
      #
      # hdiutil attaches the image on macOS 14 and 15; on macOS 27 it says no
      # mountable file system, and diskutil image attach, which an older macOS
      # does not have, does it (tried 2026-10-19). Either mounts it under
      # /Volumes.
      - name: install Google Chrome (macOS)
        if: runner.os == 'macOS'
        run: |
          case $CHANNEL in
            stable) url=https://dl.google.com/chrome/mac/universal/stable/GGRO/googlechrome.dmg
                    app="Google Chrome" ;;
            beta) url=https://dl.google.com/chrome/mac/universal/beta/googlechromebeta.dmg
                  app="Google Chrome Beta" ;;
            *) echo "no channel $CHANNEL"; exit 1 ;;
          esac
          curl -sSfL -o "$RUNNER_TEMP/chrome.dmg" "$url"
          attached=$(hdiutil attach -nobrowse -readonly "$RUNNER_TEMP/chrome.dmg" ||
            diskutil image attach --mountOptions nobrowse --readOnly "$RUNNER_TEMP/chrome.dmg")
          mount=$(printf '%s\n' "$attached" | awk -F '\t' '/\/Volumes\// {print $NF}' | tail -n 1)
          ditto "$mount/$app.app" "$RUNNER_TEMP/$app.app"
          hdiutil detach "$mount" || diskutil eject "$mount"
          binary="$RUNNER_TEMP/$app.app/Contents/MacOS/$app"
          { echo "CHROME=$binary"; echo "CHROME_VERSION=$("$binary" --version)"; } >> "$GITHUB_ENV"

      - name: install Google Chrome (Linux)
        if: runner.os == 'Linux'
        run: |
          case $CHANNEL in
            stable) package=google-chrome-stable dir=chrome ;;
            beta) package=google-chrome-beta dir=chrome-beta ;;
            *) echo "no channel $CHANNEL"; exit 1 ;;
          esac
          curl -sSfL -o "$RUNNER_TEMP/chrome.deb" "https://dl.google.com/linux/direct/${package}_current_amd64.deb"
          sudo apt-get update
          sudo apt-get install -y "$RUNNER_TEMP/chrome.deb"
          binary=/opt/google/$dir/chrome
          { echo "CHROME=$binary"; echo "CHROME_VERSION=$("$binary" --version)"; } >> "$GITHUB_ENV"

      # `chrome.exe --version` starts the browser rather than saying what it
      # is (the capture workflow sat seven minutes on it): the version is the
      # file's.
      - name: install Google Chrome (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          switch ($env:CHANNEL) {
            'stable' { $url = 'https://dl.google.com/tag/s/dl/chrome/install/googlechromestandaloneenterprise64.msi'; $dir = 'Chrome' }
            'beta' { $url = 'https://dl.google.com/tag/s/dl/chrome/install/beta/googlechromebetastandaloneenterprise64.msi'; $dir = 'Chrome Beta' }
            default { throw "no channel $env:CHANNEL" }
          }
          $msi = Join-Path $env:RUNNER_TEMP 'chrome.msi'
          Invoke-WebRequest -UseBasicParsing -OutFile $msi -Uri $url
          $installed = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/i', $msi, '/quiet', '/norestart'
          "msiexec exited $($installed.ExitCode)"
          $binary = "C:\Program Files\Google\$dir\Application\chrome.exe"
          if (-not (Test-Path -LiteralPath $binary)) {
            Get-ChildItem 'C:\Program Files\Google' -Recurse -Filter chrome.exe -ErrorAction SilentlyContinue | ForEach-Object FullName
            throw "no Google Chrome at $binary"
          }
          $info = (Get-Item -LiteralPath $binary).VersionInfo
          "CHROME=$binary" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CHROME_VERSION=$($info.ProductName) $($info.ProductVersion)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: which Chrome
        id: chrome
        run: |
          [ -f "$CHROME" ] || { echo "no Google Chrome at $CHROME"; exit 1; }
          major=$(printf '%s' "$CHROME_VERSION" | grep -oE '[0-9]+' | head -n 1)
          [ -n "$major" ] || { echo "no version in '$CHROME_VERSION'"; exit 1; }
          echo "$CHROME_VERSION at $CHROME"
          { echo "version=$CHROME_VERSION"; echo "major=$major"; } >> "$GITHUB_OUTPUT"

      # measure exits 0 when the browser is what the fixtures say, 3 when it is
      # not, and anything else when it could not measure: that is no drift, and
      # fails the job rather than filing one.
      #
      # --no-sandbox on Linux and Windows, as the capture workflow says why:
      # without it Chrome starts, loads no page and says nothing. It is process
      # isolation, neither TLS nor a header.
      - name: hold it to the fixtures
        id: check
        run: |
          go build -o "$RUNNER_TEMP/bin/" ./internal/harness/measure
          measure="$RUNNER_TEMP/bin/measure"
          if [ -f "$measure.exe" ]; then measure="$measure.exe"; fi
          args=()
          if [ "$RUNNER_OS" != macOS ]; then args=(--browser-arg=--no-sandbox); fi
          verdict=matches
          for run in 1 2; do
            set +e
            "$measure" --browser "$CHROME" "${args[@]}" --check --newer > differences.txt 2> measure.log
            code=$?
            set -e
            tail -n 40 measure.log
            case $code in
              0) verdict=matches; break ;;
              3) verdict=differs; echo "run $run: $(wc -l < differences.txt | tr -d ' ') differences" ;;
              *) echo "the check could not run: measure exited $code"; exit 1 ;;
            esac
          done
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          if [ "$verdict" = differs ]; then cat differences.txt; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.check.outputs.verdict != ''
        with:
          name: behaviour-${{ runner.os }}-${{ matrix.channel }}
          path: |
            differences.txt
            measure.log

      - name: file it
        if: >-
          steps.check.outputs.verdict == 'differs' &&
          (github.event_name == 'schedule' || inputs.file)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.chrome.outputs.version }}
          MAJOR: ${{ steps.chrome.outputs.major }}
          REVIEWER: ${{ vars.PROFILE_REVIEWER }}
        run: |
          title="Chrome $CHANNEL $MAJOR on $RUNNER_OS does not do what the fixtures say"
          # git is on every runner, and its digest of a file is the file's.
          digest=$(git hash-object differences.txt)
          {
            echo "The weekly check measured every fixture of the bench on $VERSION ($CHANNEL,"
            echo "$RUNNER_OS) with \`measure --check --newer\`, twice, and it differed from them both"
            echo "times: something tls-forge is held to, Chrome may now do otherwise, or does"
            echo "otherwise on $RUNNER_OS than on macOS, where the fixtures were measured. The run:"
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID, whose"
            echo "artifact has every difference and the measurement's log."
            echo
            echo "What a build's version and platform decide, sec-ch-ua and the length it gives"
            echo "an HTTP/1.1 head, is held to what the browser sends itself; the profile check"
            echo "deals with it. A records scenario on the 1,400 bytes a head and a body are"
            echo "merged up to moves with the head, and is said here when it crosses them."
            echo
            echo "To look into one: \`go run ./internal/harness/measure --browser PATH --check"
            echo "--newer --only ID\`, with every other fixture given as empty, and"
            echo "\`--browser-arg=--no-sandbox\` on Linux and Windows. When Chrome does something"
            echo "new, measure the fixture again (without --check) and hold tls-forge to it."
            echo
            echo '<details><summary>what differs</summary>'
            echo
            echo '```'
            head -n 300 differences.txt
            echo '```'
            echo '</details>'
            echo
            echo "<!-- digest: $digest -->"
          } > body.md
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -z "$number" ]; then
            gh issue create --title "$title" --body-file body.md --label drift ||
              gh issue create --title "$title" --body-file body.md
            if [ -n "$REVIEWER" ]; then
              gh issue edit "$(gh issue list --state open --search "in:title \"$title\"" --json number \
                --jq '.[0].number')" --add-assignee "$REVIEWER" || echo "could not assign $REVIEWER"
            fi
          elif gh issue view "$number" --json body,comments --jq '[.body, .comments[].body] | join("\n")' |
              grep -qF "digest: $digest"; then
            echo "#$number already says this"
          else
            gh issue comment "$number" --body-file body.md
          fi

      - name: summary
        if: always()
        env:
          VERSION: ${{ steps.chrome.outputs.version }}
          VERDICT: ${{ steps.check.outputs.verdict }}
        run: |
          {
            echo "| | |"
            echo "|---|---|"
            echo "| platform | $RUNNER_OS |"
            echo "| channel | $CHANNEL |"
            echo "| browser | ${VERSION:-not installed} |"
            echo "| behaviour | ${VERDICT:-the check could not run} |"
          } >> "$GITHUB_STEP_SUMMARY"
