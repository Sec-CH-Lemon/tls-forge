name: drift

# Is the shipped profile still the browser people are running?
#
# This is the one thing in the repository that breaks on its own. Chrome ships a
# new major every few weeks, the handshake moves with it, and nothing here
# changes — so the profile quietly stops being an impersonation and the first
# sign is somebody's scraper collecting challenge pages. Every other check
# answers a question about the code; this one answers a question about the
# world, so it has to be asked on a timer rather than on a push.
#
# A drifted profile produces candidate and separate provenance artifacts.
# The review job verifies exact hashes and retained basis fields. It creates
# no branch or pull request; promotion to development follows native acceptance.
#
# The behaviour job asks the larger half of the same question: does a real
# Chrome, Stable and Beta, on macOS, Linux and Windows, still do everything the
# bench's fixtures say, which tls-forge is held to? It files an issue when it
# does not; a change of behaviour wants code, and no measurement can propose
# that.
on:
  schedule:
    # Mondays, early. Chrome's stable rollouts start midweek, so a Monday run
    # sees a settled picture rather than the first hour of one.
    - cron: '17 6 * * 1'
  # By hand, each half on its own, and a behaviour that differs filed only when
  # asked: a run to see what a change does should not open issues for it.
  workflow_dispatch:
    inputs:
      profile:
        description: Compare Chrome Stable and capture candidates with provenance when drifted
        type: boolean
        default: true
      behaviour:
        description: Hold Chrome Stable and Beta to every fixture of the bench, on macOS, Linux and Windows
        type: boolean
        default: true
      file:
        description: File an issue for each behaviour that differs, as a scheduled run does
        type: boolean
        default: false
      # Which of them the behaviour job measures, so that a check run again
      # after a fix costs only what it has to: CI minutes are limited.
      os:
        description: The runners the behaviour job measures on, a JSON list
        type: string
        default: '["macos-latest", "ubuntu-latest", "windows-latest"]'
      channels:
        description: The channels of Chrome it measures, a JSON list
        type: string
        default: '["stable", "beta"]'
      fixtures:
        description: >-
          The fixtures it holds Chrome to, named as measure's flags (requests,
          connections, decoding, hpack, records, alps, flow, urls, hellos,
          false-start) and separated by spaces or commas; every one when empty
        type: string
        default: ''
      only:
        description: >-
          The scenarios it measures, by name and comma-separated, as measure's
          --only, of the fixtures that hold them; every one when empty
        type: string
        default: ''

permissions:
  contents: read
  issues: write          # the fallback, for a drift that could not be measured

jobs:
  check:
    if: github.event_name == 'schedule' || inputs.profile
    timeout-minutes: 30
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.compare.outputs.verdict }}
      shipped: ${{ steps.shipped.outputs.major }}
      serving: ${{ steps.serving.outputs.version }}
      serving_major: ${{ steps.serving.outputs.major }}
    env:
      # Chrome's sandbox does not work on a hosted runner and fails silently.
      # Process isolation is neither TLS nor a header, so the comparison is the
      # same comparison. See the capture workflow for the measurement.
      FLAGS: --browser-arg=--no-sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # Google Chrome, not Chrome for Testing, and not whatever the image was
      # built with. Both would answer a different question — see the capture
      # workflow, where the same two mistakes are spelled out.
      - name: install Google Chrome
        run: |
          curl -sL -o /tmp/chrome.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/chrome.deb xvfb
          google-chrome --version

      - name: what everybody else is running
        id: serving
        run: |
          version=$(python3 scripts/chrome-version.py --platforms linux)
          if [ -z "$version" ]; then
            echo "Chrome version lookup returned an empty version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"

      - name: what is shipped
        id: shipped
        run: |
          # The directory names are the versions, so the newest is the newest
          # major among them. Read off the tree rather than out of the binary:
          # this is asking what the repository ships, not what a run would wear.
          #
          # A glob rather than `ls`, whose output depends on how the shell it
          # runs in is configured — a developer with `ls -F` gets `chrome_151/`
          # and a pattern anchored on the digits then matches nothing, which
          # produced "chrome_" here before anybody looked. And `-gt` rather than
          # sort, so that 9 is not newer than 152.
          major=
          for dir in profile/data/chrome_*/; do
            name=${dir%/}; name=${name##*/}; n=${name#chrome_}
            case $n in ""|*[!0-9]*) continue ;; esac
            if [ -z "$major" ] || [ "$n" -gt "$major" ]; then major=$n; fi
          done
          if [ -z "$major" ]; then echo "no chrome_<major> in profile/data"; exit 1; fi
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "chrome_$major"

      # The authoritative half. A version number moving is a hint; the
      # handshake differing is the fact — Chrome can ship a new major without
      # touching its ClientHello, and has.
      #
      # Three outcomes, and they must not be confused: 0 the profile still
      # matches, 3 it does not, anything else the check itself broke. They
      # shared an exit code until this workflow needed the difference.
      - name: does the shipped profile still match a real Chrome
        id: compare
        run: |
          # `go run` turns any non-zero program status into its own exit code 1
          # after printing "exit status N". Execute the built command directly
          # so status 3 remains distinguishable from an operational failure.
          go build -o "$RUNNER_TEMP/tls-forge" ./cmd/tls-forge
          set +e
          xvfb-run -a "$RUNNER_TEMP/tls-forge" compare --color never "$FLAGS" \
            --timeout 3m > compare.txt 2>&1
          code=$?
          set -e
          cat compare.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case $code in
            0) echo "verdict=matches" >> "$GITHUB_OUTPUT" ;;
            3) echo "verdict=drifted" >> "$GITHUB_OUTPUT" ;;
            *) echo "the comparison could not be made; failing rather than"
               echo "reporting a browser that would not start as a drifted profile."
               exit 1 ;;
          esac

      # The diff travels to the pull request, which is where somebody will read
      # it, rather than being left in a log nobody opens.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.compare.outputs.verdict == 'drifted'
        with:
          name: drift-diff
          path: compare.txt

      - name: summary
        if: always()
        env:
          VERDICT: ${{ steps.compare.outputs.verdict }}
          SHIPPED: ${{ steps.shipped.outputs.major }}
          SERVING: ${{ steps.serving.outputs.version }}
        run: |
          {
            echo "| | |"
            echo "|---|---|"
            echo "| shipped | chrome_$SHIPPED |"
            echo "| being served | $SERVING |"
            echo "| verdict | ${VERDICT:-the check could not run} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Measure it. The same workflow the Actions tab runs by hand, called rather
  # than copied: it already knows that a runner needs --no-sandbox, that Chrome
  # for Testing is a different browser, and that the version being served is not
  # the newest one published. A second copy of that would drift from the first.
  capture:
    needs: check
    if: needs.check.outputs.verdict == 'drifted'
    uses: ./.github/workflows/capture.yml
    permissions:
      contents: read

  # Review artifacts without creating branches. Owner policy keeps project
  # work on development; publication and profile promotion are explicit actions.
  review:
    needs: [check, capture]
    if: always() && needs.check.outputs.verdict == 'drifted'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: verify candidate provenance
        run: python3 scripts/check-capture-artifacts.py artifacts --engine engine/version.json >> "$GITHUB_STEP_SUMMARY"

  behaviour:
    if: github.event_name == 'schedule' || inputs.behaviour
    timeout-minutes: 180
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # A scheduled run has no inputs: every runner and channel.
        os: ${{ fromJSON(inputs.os || '["macos-latest", "ubuntu-latest", "windows-latest"]') }}
        channel: ${{ fromJSON(inputs.channels || '["stable", "beta"]') }}
    defaults:
      run:
        shell: bash
    env:
      CHANNEL: ${{ matrix.channel }}
      # A scheduled run has none: every fixture and scenario.
      FIXTURES: ${{ inputs.fixtures }}
      ONLY: ${{ inputs.only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # From Google, not the image's: where the browser is (CHROME) and what
      # it says it is (CHROME_VERSION), as the pinned gate of release.yml
      # takes it too.
      - uses: ./.github/actions/google-chrome
        with:
          channel: ${{ matrix.channel }}

      - name: which Chrome
        id: chrome
        run: |
          [ -f "$CHROME" ] || { echo "no Google Chrome at $CHROME"; exit 1; }
          major=$(printf '%s' "$CHROME_VERSION" | grep -oE '[0-9]+' | head -n 1)
          [ -n "$major" ] || { echo "no version in '$CHROME_VERSION'"; exit 1; }
          echo "$CHROME_VERSION at $CHROME"
          { echo "version=$CHROME_VERSION"; echo "major=$major"; } >> "$GITHUB_OUTPUT"

      # measure exits 0 when the browser is what the fixtures say, 3 when it is
      # not, and anything else when it could not measure: that is no drift, and
      # fails the job rather than filing one.
      #
      # A difference counts when the second run has it too. A block of the list,
      # a line that begins with something and the indented lines after it, is
      # known by what that line says before its first colon (a scenario, with
      # its protocol and request where it has them), and is filed as the second
      # run said it. What one run alone had is the runner's, not Chrome's (a
      # navigation its start broke, which the error page reloaded; a connection
      # opened as it started): the verdict is then unsteady, and nothing is filed.
      #
      # --no-sandbox on Linux and Windows, as the capture workflow says why:
      # without it Chrome starts, loads no page and says nothing. It is process
      # isolation, neither TLS nor a header.
      #
      # A fixture the run does not name is given as empty, which measure does
      # not measure; a name it does not know ends the job before anything is.
      - name: hold it to the fixtures
        id: check
        run: |
          go build -o "$RUNNER_TEMP/bin/" ./internal/harness/measure
          measure="$RUNNER_TEMP/bin/measure"
          if [ -f "$measure.exe" ]; then measure="$measure.exe"; fi
          args=()
          if [ "$RUNNER_OS" != macOS ]; then args=(--browser-arg=--no-sandbox); fi
          read -ra named <<< "${FIXTURES//,/ }"
          if [ "${#named[@]}" -gt 0 ]; then
            all="requests connections decoding hpack records alps flow urls hellos false-start"
            for fixture in "${named[@]}"; do
              case " $all " in
                *" $fixture "*) ;;
                *) echo "no fixture $fixture: the fixtures are $all"; exit 1 ;;
              esac
            done
            for fixture in $all; do
              case " ${named[*]} " in
                *" $fixture "*) ;;
                *) args+=("--$fixture=") ;;
              esac
            done
          fi
          if [ -n "$ONLY" ]; then args+=("--only=$ONLY"); fi
          verdict=matches
          for run in 1 2; do
            set +e
            "$measure" --browser "$CHROME" "${args[@]}" --check --newer > "differences-$run.txt" 2> "measure-$run.log"
            code=$?
            set -e
            tail -n 40 "measure-$run.log"
            case $code in
              0) verdict=matches; break ;;
              3) verdict=differs; echo "run $run: $(grep -c '^[^ ]' "differences-$run.txt") differences" ;;
              *) echo "the check could not run: measure exited $code"; exit 1 ;;
            esac
          done
          if [ "$verdict" = differs ]; then
            awk '/^[^ ]/ { k = $0; sub(/:.*/, "", k); print k }' differences-1.txt | sort -u > first-keys.txt
            awk 'NR == FNR { known[$0] = 1; next }
                 /^[^ ]/ { k = $0; sub(/:.*/, "", k); keep = (k in known) }
                 keep' first-keys.txt differences-2.txt > differences-both.txt
            if [ -s differences-both.txt ]; then
              echo "both runs: $(grep -c '^[^ ]' differences-both.txt) differences"
              cat differences-both.txt
            else
              verdict=unsteady
              echo "no difference in both runs"
            fi
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      # Whatever the check came to, and when it could not run too: what each
      # run said is how to tell why.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: behaviour-${{ runner.os }}-${{ matrix.channel }}
          path: |
            differences-*.txt
            measure-*.log
          if-no-files-found: ignore

      - name: file it
        if: >-
          steps.check.outputs.verdict == 'differs' &&
          (github.event_name == 'schedule' || inputs.file)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.chrome.outputs.version }}
          MAJOR: ${{ steps.chrome.outputs.major }}
          REVIEWER: ${{ vars.PROFILE_REVIEWER }}
        run: |
          title="Chrome $CHANNEL $MAJOR on $RUNNER_OS does not do what the fixtures say"
          # git is on every runner, and its digest of a file is the file's.
          digest=$(git hash-object differences-both.txt)
          what="every fixture of the bench"
          if [ -n "${FIXTURES//[ ,]/}" ]; then what="the bench's $FIXTURES"; fi
          if [ -n "$ONLY" ]; then what="$what (only $ONLY)"; fi
          {
            echo "The check measured $what on $VERSION ($CHANNEL,"
            echo "$RUNNER_OS) with \`measure --check --newer\`, twice, and both times it differed"
            echo "from them in what follows: something tls-forge is held to, Chrome may now do"
            echo "otherwise, or does otherwise on $RUNNER_OS than on macOS, where the fixtures were"
            echo "measured. The run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID,"
            echo "whose artifact has each run's differences and log, and those of both."
            echo
            echo "What a build's version and platform decide, sec-ch-ua and the length it gives"
            echo "an HTTP/1.1 head, is held to what the browser sends itself; the profile check"
            echo "deals with it. A records scenario on the 1,400 bytes a head and a body are"
            echo "merged up to moves with the head, and is said here when it crosses them."
            echo
            echo "To look into one: \`go run ./internal/harness/measure --browser PATH --check"
            echo "--newer --only ID\`, with every other fixture given as empty, and"
            echo "\`--browser-arg=--no-sandbox\` on Linux and Windows. When Chrome does something"
            echo "new, measure the fixture again (without --check) and hold tls-forge to it."
            echo
            echo '<details><summary>what differs</summary>'
            echo
            echo '```'
            head -n 300 differences-both.txt
            echo '```'
            echo '</details>'
            echo
            echo "<!-- digest: $digest -->"
          } > body.md
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -z "$number" ]; then
            gh issue create --title "$title" --body-file body.md --label drift ||
              gh issue create --title "$title" --body-file body.md
            if [ -n "$REVIEWER" ]; then
              gh issue edit "$(gh issue list --state open --search "in:title \"$title\"" --json number \
                --jq '.[0].number')" --add-assignee "$REVIEWER" || echo "could not assign $REVIEWER"
            fi
          elif gh issue view "$number" --json body,comments --jq '[.body, .comments[].body] | join("\n")' |
              grep -qF "digest: $digest"; then
            echo "#$number already says this"
          else
            gh issue comment "$number" --body-file body.md
          fi

      - name: summary
        if: always()
        env:
          VERSION: ${{ steps.chrome.outputs.version }}
          VERDICT: ${{ steps.check.outputs.verdict }}
        run: |
          {
            echo "| | |"
            echo "|---|---|"
            echo "| platform | $RUNNER_OS |"
            echo "| channel | $CHANNEL |"
            echo "| browser | ${VERSION:-not installed} |"
            echo "| fixtures | ${FIXTURES:-every one} |"
            echo "| scenarios | ${ONLY:-every one} |"
            echo "| behaviour | ${VERDICT:-the check could not run} |"
          } >> "$GITHUB_STEP_SUMMARY"
