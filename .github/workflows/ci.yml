name: ci

on:
  # A push to development runs nothing (owner, 2026-11-05): run this by hand
  # (workflow_dispatch) on the commit to check.
  push:
    branches: [main]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race-scope: root
            package: .
            shard: 0
          - os: ubuntu-latest
            race-scope: root
            package: .
            shard: 1
          - os: ubuntu-latest
            race-scope: cli
            package: ./cmd/tls-forge
            shard: 0
          - os: ubuntu-latest
            race-scope: cli
            package: ./cmd/tls-forge
            shard: 1
          - os: ubuntu-latest
            race-scope: packages
          - os: macos-latest
            race-scope: all
          - os: windows-latest
            race-scope: all
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Read from go.mod rather than repeating the version here, so that the
          # two cannot drift apart.
          go-version-file: go.mod
          cache: true

      - run: go build ./...
      - run: go vet ./...

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.os == 'ubuntu-latest' && (matrix.race-scope == 'root' || matrix.race-scope == 'cli')
        with:
          python-version: '3.13'

      # The root and CLI suites are both heavy under race, each too long for
      # one runner within the 20m every binary keeps (the CLI's ran 882s on
      # 2026-11-01, past 1200s on 2026-11-07). Each one's complete compiler
      # inventory is partitioned across two Linux runners without omissions;
      # the other packages still run once, on a runner of their own. Every
      # binary retains the 20m timeout.
      - name: test ${{ matrix.race-scope }} under race
        if: matrix.os == 'ubuntu-latest' && (matrix.race-scope == 'root' || matrix.race-scope == 'cli')
        run: python3 scripts/go_root_shard.py --package '${{ matrix.package }}' --index '${{ matrix.shard }}' --count 2 --manifest "$RUNNER_TEMP/${{ matrix.race-scope }}-race-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.os == 'ubuntu-latest' && (matrix.race-scope == 'root' || matrix.race-scope == 'cli')
        with:
          name: ${{ matrix.race-scope }}-race-inventory-${{ matrix.shard }}
          path: ${{ runner.temp }}/${{ matrix.race-scope }}-race-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7
      - name: test all other packages under race
        if: matrix.os == 'ubuntu-latest' && matrix.race-scope == 'packages'
        shell: bash
        run: |
          root="$(go list -m)"
          cli="$root/cmd/tls-forge"
          discovered="$(go list ./...)"
          others=()
          found_root=false
          found_cli=false
          while IFS= read -r package; do
            if [[ "$package" == "$root" ]]; then
              found_root=true
            elif [[ "$package" == "$cli" ]]; then
              found_cli=true
            else
              others+=("$package")
            fi
          done <<< "$discovered"
          if [[ "$found_root" != true || "$found_cli" != true || "${#others[@]}" -eq 0 ]]; then
            exit 1
          fi
          go test -race -timeout 20m "${others[@]}"
      - name: test
        if: matrix.os != 'ubuntu-latest'
        run: go test -timeout 10m ./...

  go-root-inventory:
    timeout-minutes: 5
    needs: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      # The root's partitions and the CLI's, each held to its own inventory.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: root-race-inventory-*
          path: ${{ runner.temp }}/root-race-manifests
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-race-inventory-*
          path: ${{ runner.temp }}/cli-race-manifests
          merge-multiple: true
      - run: python3 scripts/go_root_shard.py --verify "$RUNNER_TEMP/root-race-manifests" --count 2 --source "$GITHUB_SHA"
      - run: python3 scripts/go_root_shard.py --verify "$RUNNER_TEMP/cli-race-manifests" --count 2 --source "$GITHUB_SHA" --package ./cmd/tls-forge

  coverage:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # A gate, not a report. Every package is at 100%.
      - run: make cover
      - name: retain the original coverage profile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 7

  security:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: govulncheck ./...

  generated:
    timeout-minutes: 15
    # What is generated or tidied is made again and held to what is committed:
    # Go formatted, go.mod and go.sum tidy and as their sums say, the report's
    # stylesheet as its template makes it, and the third-party notices as the
    # modules linked into the binary make them. A stale one would ship.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: scripts/check-generated.sh

  lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned, and pinned to a v2 release specifically.
          #
          # The action's major version decides which golangci-lint line it
          # installs, and v1 cannot read a v2 configuration file: it fails at
          # `config verify` before looking at a single line of Go. Pinning the
          # tool as well keeps a new lint release from turning this job red on a
          # change that had nothing to do with it.
          version: v2.15.0
          # Built from source by the Go go.mod names: a binary built by an older
          # Go refuses a module of a newer one, and v2.13.2's x/tools could not
          # read Go 1.27's export data at all (2026-11-10).
          install-mode: goinstall
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: actionlint
      # Every action pinned to the commit of a release: a tag or a branch moves,
      # and what ran would be whatever was pushed there last.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # make workflows-check measures scripts/fork_sync.py's tests with
      # coverage.py, in a virtual environment of the Python package's test
      # dependencies.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: make workflows-check

  node:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Node 20.12 is the documented minimum. It cannot strip types, so
          # the suite is compiled in place there, and its test runner predates
          # the built-in coverage thresholds: compatibility is checked there,
          # and the 100% gate runs on Node 24 across every supported OS.
          - os: ubuntu-latest
            node-version: '20.12'
            coverage: false
          - os: ubuntu-latest
            node-version: '24'
            coverage: true
          - os: macos-latest
            node-version: '24'
            coverage: true
          - os: windows-latest
            node-version: '24'
            coverage: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      # TypeScript and Node's types, as the lockfile pins them: the type check,
      # the compile the release scripts and the reference make, and the Node
      # 20.12 leg's compile need them.
      - run: npm ci --ignore-scripts
        working-directory: node
      # Windows cannot execute the shell-script transport used by the tests, so
      # build the equivalent native fixture there. It is under testdata and can
      # never enter a release binary or Go's normal package list.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: runner.os == 'Windows' || (matrix.os == 'ubuntu-latest' && matrix.coverage)
        with:
          go-version-file: go.mod
          cache: true
      - name: build the Windows test transport
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $daemon = Join-Path $env:RUNNER_TEMP 'tls-forge-test-daemon.exe'
          go build -o $daemon ./testdata/fake-daemon
          "TLSFORGE_TEST_DAEMON=$daemon" >> $env:GITHUB_ENV
      # The native transport runs on Linux too, so that it answers as the Node
      # fake does (testdata/fake-daemon/scenarios.json) is found here and not
      # only on Windows.
      - name: test against the native test transport
        if: matrix.os == 'ubuntu-latest' && matrix.coverage
        run: |
          go build -o "$RUNNER_TEMP/tls-forge-test-daemon" ./testdata/fake-daemon
          cd node && TLSFORGE_TEST_DAEMON="$RUNNER_TEMP/tls-forge-test-daemon" node --test "test/*.test.ts"

      # The release scripts, the Python packaging among them, each at 100%.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.os == 'ubuntu-latest' && matrix.coverage
        with:
          python-version: '3.13'
      - name: test release scripts
        if: matrix.os == 'ubuntu-latest' && matrix.coverage
        run: |
          node --check scripts/check-published-sdk.mjs
          make release-test

      # In a clean checkout, which has only what git tracks: a link to a file
      # kept out of git, or to a heading that is gone, is broken for everybody.
      - name: every link in the documentation leads somewhere
        if: matrix.os == 'ubuntu-latest' && matrix.coverage
        run: make docs-check
      - name: build the public documentation from current source
        if: matrix.os == 'ubuntu-latest' && matrix.coverage
        run: |
          python -m pip install -r docs-requirements.txt
          make docs-site-check DOCS_MKDOCS=mkdocs

      # npm test includes the 100% line/function/branch coverage gate.
      - run: npm test
        if: matrix.coverage
        working-directory: node
      # Node 20.12 runs what tsc writes of the suite beside it, imports named
      # .js as the compiled package names them. Unquoted so the shell expands
      # it: its test runner predates glob support, and it runs only on Linux.
      # Every test file, not one named file, so a new one cannot arrive and
      # never run.
      - run: npx tsc -p tsconfig.json --noEmit false && node --test test/*.test.js
        if: ${{ !matrix.coverage }}
        working-directory: node

  python:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest and newest on Linux establish interpreter compatibility;
          # the newest also exercises process, pipe and path behaviour on every
          # supported OS. Python 3.9 is unavailable on current arm64 macOS
          # runners, so duplicating the full cartesian product would not work.
          # Nor on Ubuntu 26.04, ubuntu-latest since 2026-10: 24.04 is the
          # last image actions/python-versions builds it for.
          - os: ubuntu-24.04
            python-version: '3.9'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: runner.os == 'Windows' || (matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13')
        with:
          go-version-file: go.mod
          cache: true
      - name: build the Windows test transport
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $daemon = Join-Path $env:RUNNER_TEMP 'tls-forge-test-daemon.exe'
          go build -o $daemon ./testdata/fake-daemon
          "TLSFORGE_TEST_DAEMON=$daemon" >> $env:GITHUB_ENV
      - run: pip install -e 'python[test]'
      # The native transport runs on Linux too, so that it answers as the
      # Python fake does (testdata/fake-daemon/scenarios.json) is found here and
      # not only on Windows.
      - name: test against the native test transport
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          go build -o "$RUNNER_TEMP/tls-forge-test-daemon" ./testdata/fake-daemon
          cd python && TLSFORGE_TEST_DAEMON="$RUNNER_TEMP/tls-forge-test-daemon" python -m pytest -q
      # A gate, like `make cover` for Go: 100% of lines and branches. Runs
      # against a stand-in transport and needs no network. Windows builds the
      # native form of that fixture above; Unix uses the existing shell wrapper.
      - run: python -m coverage run -m pytest -q
        working-directory: python
      - run: python -m coverage report
        working-directory: python
      # The package's types, as strictly as mypy checks them, and the refusals
      # in tests/typing_contract.py. mypy needs Python 3.10, so one leg.
      - name: type-check the package
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          pip install -e 'python[typecheck]'
          cd python && python -m mypy

  examples:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      # Install each example as an independent consumer and execute it. The Go
      # example talks to a local HTTP server; Node and Python use the native
      # JSON-lines fixture, so this gate is deterministic and needs no internet.
      - run: node scripts/check-examples.mjs

  wrapper-smoke:
    timeout-minutes: 20
    # Do the Go daemon and its two wrappers still agree on the bytes?
    #
    # The Node and Python suites run against hand-written fakes and never touch
    # the real binary, which is how a renamed response field once passed every
    # gate and shipped. testdata/protocol pins the field names; this pins what
    # the binary actually emits, end to end through each wrapper.
    #
    # One OS is enough: the contract is a byte format, not a platform. The
    # per-platform behaviour of the wrappers is covered by the node and python
    # jobs above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: make wrapper-smoke

  packaging:
    timeout-minutes: 25
    # Does a release still build?
    #
    # The release's own path, scripts/release-build.mjs, makes the set of the
    # engine's version (engine/version.json, the only one it builds) for this
    # commit, every file a tag would publish with its SHA256SUMS and
    # manifest.json; without this the first tag would be the first time the
    # packaging ran, and a release that fails halfway has published to
    # whichever registry came first. Storing and publishing are all that is
    # left out.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: pip install build wheel
      # The npm package's dist/ is compiled with the TypeScript node/'s
      # lockfile pins.
      - run: npm ci --ignore-scripts
        working-directory: node
      - id: version
        run: echo "version=$(jq -r .version engine/version.json)" >> "$GITHUB_OUTPUT"
      - run: node scripts/release-build.mjs --version "${{ steps.version.outputs.version }}" --commit "$GITHUB_SHA" --out dist/set --python python

      # The oldest hatchling pyproject.toml allows builds the distributions as
      # well, and as scripts/pypi-release.py checks them, licence metadata and
      # all: a floor nothing builds with goes stale without anyone seeing.
      - name: the oldest hatchling allowed builds them too
        run: |
          floor=$(sed -n 's/^requires = \["hatchling>=\([0-9.]*\)"\]$/\1/p' python/pyproject.toml)
          test -n "$floor"
          echo "hatchling==$floor" > "$RUNNER_TEMP/floor.txt"
          mkdir -p "$RUNNER_TEMP/bin"
          for target in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            printf '#!/bin/sh\n' > "$RUNNER_TEMP/bin/tls-forge-$target"
          done
          printf 'MZ' > "$RUNNER_TEMP/bin/tls-forge-windows-amd64.exe"
          PIP_CONSTRAINT="$RUNNER_TEMP/floor.txt" python scripts/pypi-release.py --version "${{ steps.version.outputs.version }}" \
            --binaries "$RUNNER_TEMP/bin" --out "$RUNNER_TEMP/floor"

      # The set crosses to the native runners as it is: archives, npm tarballs
      # and wheels keep their binaries' modes inside them, which the artifact
      # transport would not keep on loose files.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-set
          if-no-files-found: error
          retention-days: 2
          path: dist/set/

  package-smoke:
    timeout-minutes: 15
    needs: packaging
    # The set's archive, npm package and wheel installed and run on every
    # machine a runner is, and on the oldest Node.js and Python the packages
    # support as well as the newest.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 is built for Ubuntu 24.04 at the latest.
          - { os: ubuntu-24.04, node: '20.12', python: '3.9' }
          - { os: ubuntu-latest, node: '24', python: '3.13' }
          - { os: ubuntu-24.04-arm, node: '24', python: '3.13' }
          - { os: macos-latest, node: '24', python: '3.13' }
          - { os: windows-latest, node: '24', python: '3.13' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-set
          path: set
      - run: node scripts/release-set.mjs verify --dir set --version ${{ needs.packaging.outputs.version }} --commit ${{ github.sha }}
      - run: node scripts/check-release-packages.mjs --version ${{ needs.packaging.outputs.version }} --set set --python python

  docker:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # What the build is given, on a checkout made dirty the way a
      # developer's is: none of that goes in, and every file git tracks that
      # the build may need does.
      - run: scripts/check-docker-context.sh
      # Built and run, not merely built: an image whose binary cannot start is
      # not a working image, and nothing else in the repository would notice.
      # Stamped as a release stamps it, with the engine's version: the binary
      # refuses to run under any other (engine.CheckBuildVersion).
      - run: docker build --build-arg VERSION="$(jq -r .version engine/version.json)" -t tls-forge:ci .
      - run: docker run --rm tls-forge:ci version
      - run: docker run --rm tls-forge:ci profiles
      # As somebody other than root, who can write where it works and where
      # it keeps its configuration, and who stops in order when stopped.
      - run: scripts/check-docker-image.sh tls-forge:ci
      # Both platforms a release publishes, the other one under emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: docker buildx build --platform linux/amd64,linux/arm64 --build-arg VERSION="$(jq -r .version engine/version.json)" .

  browser:
    timeout-minutes: 20
    # Does the shipped profile still match a real browser?
    #
    # This is the check the project exists for, and the only one that can start
    # failing on its own: a browser update changes the handshake without
    # changing a line of this repository. Run it by hand from the Actions tab
    # after a browser release, or wait for the next push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome

      - name: compare against the runner's Chrome
        # Informational: the runner's Chrome is whatever the action installs
        # this week, so a difference means "the shipped profile is not this
        # build", which is useful to see rather than a reason to fail.
        #
        # --disable-field-trial-config because this installs Chrome for Testing,
        # which turns on the testing field-trial configuration and with it
        # experiments real users do not have — measured, two extra extensions
        # and a different JA4. Without the flag this job reports three fields
        # differing on every push, which is noise that hides the difference it
        # exists to show. This remains informational: Chrome for Testing and
        # headless mode identify themselves in header values, and `compare`
        # correctly treats those as part of the cross-layer fingerprint.
        # `capture` with a headed release browser produces the strict profile.
        continue-on-error: true
        run: |
          go run ./cmd/tls-forge compare --headless \
            --browser "${{ steps.chrome.outputs.chrome-path }}" \
            --browser-arg=--no-sandbox \
            --browser-arg=--disable-field-trial-config
