name: ci

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Read from go.mod rather than repeating the version here, so that the
          # two cannot drift apart.
          go-version-file: go.mod
          cache: true

      - run: go build ./...
      - run: go vet ./...

      # -race on one platform is enough to find a data race and costs a lot of
      # wall clock on the others.
      # -timeout so a test that hangs is killed by Go, which prints a goroutine
      # dump naming it, rather than by the job's ceiling, which prints nothing.
      - name: test
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -timeout 5m ./...
      - name: test
        if: matrix.os != 'ubuntu-latest'
        run: go test -timeout 5m ./...

  coverage:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # A gate, not a report. Every package is at 100%.
      - run: make cover

  security:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: govulncheck ./...

  lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, and pinned to a v2 release specifically.
          #
          # The action's major version decides which golangci-lint line it
          # installs, and v1 cannot read a v2 configuration file: it fails at
          # `config verify` before looking at a single line of Go. Pinning the
          # tool as well keeps a new lint release from turning this job red on a
          # change that had nothing to do with it.
          version: v2.12.2

  node:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Node 20.12 is the documented minimum. Its test runner predates the
          # built-in coverage thresholds, so compatibility is checked there and
          # the 100% gate runs on Node 24 across every supported OS.
          - os: ubuntu-latest
            node-version: '20.12'
            coverage: false
          - os: ubuntu-latest
            node-version: '24'
            coverage: true
          - os: macos-latest
            node-version: '24'
            coverage: true
          - os: windows-latest
            node-version: '24'
            coverage: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      # Windows cannot execute the shell-script transport used by the tests, so
      # build the equivalent native fixture there. It is under testdata and can
      # never enter a release binary or Go's normal package list.
      - uses: actions/setup-go@v7
        if: runner.os == 'Windows'
        with:
          go-version-file: go.mod
          cache: true
      - name: build the Windows test transport
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $daemon = Join-Path $env:RUNNER_TEMP 'tls-forge-test-daemon.exe'
          go build -o $daemon ./testdata/fake-daemon
          "TLSFORGE_TEST_DAEMON=$daemon" >> $env:GITHUB_ENV

      # npm test includes the 100% line/function/branch coverage gate.
      - run: npm test
        if: matrix.coverage
        working-directory: node
      - run: node --test 'test/*.test.js'
        if: ${{ !matrix.coverage }}
        working-directory: node

  python:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest and newest on Linux establish interpreter compatibility;
          # the newest also exercises process, pipe and path behaviour on every
          # supported OS. Python 3.9 is unavailable on current arm64 macOS
          # runners, so duplicating the full cartesian product would not work.
          - os: ubuntu-latest
            python-version: '3.9'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-go@v7
        if: runner.os == 'Windows'
        with:
          go-version-file: go.mod
          cache: true
      - name: build the Windows test transport
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $daemon = Join-Path $env:RUNNER_TEMP 'tls-forge-test-daemon.exe'
          go build -o $daemon ./testdata/fake-daemon
          "TLSFORGE_TEST_DAEMON=$daemon" >> $env:GITHUB_ENV
      - run: pip install -e 'python[test]'
      # A gate, like `make cover` for Go: 100% of lines and branches. Runs
      # against a stand-in transport and needs no network. Windows builds the
      # native form of that fixture above; Unix uses the existing shell wrapper.
      - run: python -m coverage run -m pytest -q
        working-directory: python
      - run: python -m coverage report
        working-directory: python

  packaging:
    timeout-minutes: 25
    # Does a release still assemble?
    #
    # The two packaging scripts run nowhere else, so without this the first tag
    # would be the first time they were exercised — and a release that fails
    # halfway has already published to whichever registry came first. Everything
    # here is the release workflow's own path, minus the publishing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install build wheel

      - name: cross-compile
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist/bin
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/amd64; do
            goos=${target%/*}; goarch=${target#*/}
            output="dist/bin/tls-forge-$goos-$goarch"
            [ "$goos" = windows ] && output="$output.exe"
            GOOS=$goos GOARCH=$goarch go build -trimpath \
              -ldflags "-s -w -X main.version=v0.0.0-ci" -o "$output" ./cmd/tls-forge
          done

      - run: node scripts/npm-release.mjs --version 0.0.0 --binaries dist/bin --out dist/npm
      - run: python scripts/pypi-release.py --version 0.0.0 --binaries dist/bin --out dist/pypi

      # Pack before testing: npm publishes tarballs, and only a packed install
      # proves that files, executable modes and optional dependency metadata all
      # survive the format users actually download.
      - name: pack the npm packages
        run: |
          mkdir -p dist/npm-packages
          for pkg in dist/npm/tls-forge-*; do
            npm pack "$pkg" --pack-destination dist/npm-packages --ignore-scripts
          done
          npm pack dist/npm/tls-forge --pack-destination dist/npm-packages --ignore-scripts

      # Hand the exact packed bytes to native runners. Tarballs and wheels keep
      # executable modes internally even though the artifact transport does not
      # preserve modes on loose files.
      - uses: actions/upload-artifact@v7
        with:
          name: sdk-distributions
          if-no-files-found: error
          retention-days: 2
          path: |
            dist/npm-packages/*.tgz
            dist/pypi/*

  package-smoke:
    timeout-minutes: 15
    needs: packaging
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: sdk-distributions
          path: dist
      - run: node scripts/check-release-packages.mjs --version 0.0.0 --dist dist --python python

  docker:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Built and run, not merely built: an image whose binary cannot start is
      # not a working image, and nothing else in the repository would notice.
      - run: docker build --build-arg VERSION=ci -t tls-forge:ci .
      - run: docker run --rm tls-forge:ci version
      - run: docker run --rm tls-forge:ci profiles

  browser:
    timeout-minutes: 20
    # Does the shipped profile still match a real browser?
    #
    # This is the check the project exists for, and the only one that can start
    # failing on its own: a browser update changes the handshake without
    # changing a line of this repository. Run it by hand from the Actions tab
    # after a browser release, or wait for the next push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: browser-actions/setup-chrome@v2
        id: chrome

      - name: compare against the runner's Chrome
        # Informational: the runner's Chrome is whatever the action installs
        # this week, so a difference means "the shipped profile is not this
        # build", which is useful to see rather than a reason to fail.
        #
        # --disable-field-trial-config because this installs Chrome for Testing,
        # which turns on the testing field-trial configuration and with it
        # experiments real users do not have — measured, two extra extensions
        # and a different JA4. Without the flag this job reports three fields
        # differing on every push, which is noise that hides the difference it
        # exists to show. It only settles the TLS half: Chrome for Testing also
        # announces itself as Chromium in sec-ch-ua, and `compare` looks at
        # header order rather than values, so that part goes unnoticed here.
        # `capture` installs real Chrome for exactly that reason.
        continue-on-error: true
        run: |
          go run ./cmd/tls-forge compare --headless \
            --browser "${{ steps.chrome.outputs.chrome-path }}" \
            --browser-arg=--no-sandbox \
            --browser-arg=--disable-field-trial-config
