name: ci

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Read from go.mod rather than repeating the version here, so that the
          # two cannot drift apart.
          go-version-file: go.mod
          cache: true

      - run: go build ./...
      - run: go vet ./...

      # -race on one platform is enough to find a data race and costs a lot of
      # wall clock on the others.
      - name: test
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...
      - name: test
        if: matrix.os != 'ubuntu-latest'
        run: go test ./...

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # A gate, not a report. Every package is at 100%.
      - run: make cover

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, and pinned to a v2 release specifically.
          #
          # The action's major version decides which golangci-lint line it
          # installs, and v1 cannot read a v2 configuration file: it fails at
          # `config verify` before looking at a single line of Go. Pinning the
          # tool as well keeps a new lint release from turning this job red on a
          # change that had nothing to do with it.
          version: v2.12.2

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # The Node tests run against a stand-in daemon, so they need no Go build
      # and no network.
      - run: node --test 'test/*.test.js'
        working-directory: node

  python:
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported and the newest: this client drives subprocesses,
        # pipes and threads, which is where behaviour differs between versions.
        python-version: ['3.9', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e 'python[test]'
      # A gate, like `make cover` for Go: 100% of lines and branches. Runs
      # against a stand-in transport, so no Go build and no network.
      - run: python -m coverage run -m pytest -q
        working-directory: python
      - run: python -m coverage report
        working-directory: python

  packaging:
    # Does a release still assemble?
    #
    # The two packaging scripts run nowhere else, so without this the first tag
    # would be the first time they were exercised — and a release that fails
    # halfway has already published to whichever registry came first. Everything
    # here is the release workflow's own path, minus the publishing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install build wheel

      - name: cross-compile
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist/bin
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/amd64; do
            goos=${target%/*}; goarch=${target#*/}
            output="dist/bin/tls-forge-$goos-$goarch"
            [ "$goos" = windows ] && output="$output.exe"
            GOOS=$goos GOARCH=$goarch go build -trimpath \
              -ldflags "-s -w -X main.version=v0.0.0-ci" -o "$output" ./cmd/tls-forge
          done

      - run: node scripts/npm-release.mjs --version 0.0.0 --binaries dist/bin --out dist/npm
      - run: python scripts/pypi-release.py --version 0.0.0 --binaries dist/bin --out dist/pypi

      # Installed from the wheel and used, which is the only check that covers
      # the whole chain: the binary is in there, it kept its exec bit, and the
      # client finds it where it expects to.
      - name: the linux wheel installs and works
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --no-index dist/pypi/*manylinux2014_x86_64*.whl
          /tmp/wheelcheck/bin/python -c "
          import subprocess, tlsforge
          binary = tlsforge.resolve_binary()
          assert 'site-packages' in binary, binary
          out = subprocess.run([binary, 'version'], capture_output=True, text=True)
          print(binary, out.stdout.strip())
          assert out.returncode == 0, out.stderr
          "

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Built and run, not merely built: an image whose binary cannot start is
      # not a working image, and nothing else in the repository would notice.
      - run: docker build --build-arg VERSION=ci -t tls-forge:ci .
      - run: docker run --rm tls-forge:ci version
      - run: docker run --rm tls-forge:ci profiles

  browser:
    # Does the shipped profile still match a real browser?
    #
    # This is the check the project exists for, and the only one that can start
    # failing on its own: a browser update changes the handshake without
    # changing a line of this repository. Run it by hand from the Actions tab
    # after a browser release, or wait for the next push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: browser-actions/setup-chrome@v2
        id: chrome

      - name: compare against the runner's Chrome
        # Informational: the runner's Chrome is whatever GitHub ships this week,
        # so a difference here means "the shipped profile is not this build",
        # which is expected and useful to see rather than a reason to fail the
        # build.
        continue-on-error: true
        run: |
          go run ./cmd/tls-forge compare \
            --headless --browser "${{ steps.chrome.outputs.chrome-path }}"
