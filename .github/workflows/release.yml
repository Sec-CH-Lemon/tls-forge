name: release

# A release is a tag, and the tag is the version: nothing reads one out of a
# committed file, and every package is stamped from it.
#
# The release's set, every file it publishes, is built once from the tag's
# commit, checked on every platform, and stored in the tag's draft GitHub
# release before anything is published. Every later attempt publishes that set
# and never one built again: what a registry already has is held to the set by
# digest, and a file that differs stops the release. Publishing waits for the
# pinned gate, the profile held to the archived Google Chrome it was measured
# on, for this commit and this set. RELEASING.md says how a release is made,
# tried without publishing, and finished after a failure.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check the set, ask each registry what it has, and store and publish nothing
        type: boolean
        default: true
      version:
        description: The version a dry run that is not on a tag builds
        type: string
        default: 0.0.0-dev.0

permissions:
  contents: read

# One attempt at a tag at a time: two would race to store its set.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  set:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      # The tag's draft release is the store of its set, and only a token that
      # can write a repository's releases sees its drafts.
      contents: write
    outputs:
      version: ${{ steps.what.outputs.version }}
      tag: ${{ steps.what.outputs.tag }}
      npm_tag: ${{ steps.what.outputs.npm_tag }}
      dry_run: ${{ steps.what.outputs.dry_run }}
      built: ${{ steps.where.outputs.build }}
      identity: ${{ steps.identity.outputs.identity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: what is released
        id: what
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          ASKED: ${{ inputs.version }}
        run: |
          dry_run=false
          [ "$DRY_RUN" = true ] && dry_run=true
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          elif [ "$dry_run" = true ]; then
            version=$ASKED
          else
            echo "::error::a release runs on its tag, and $GITHUB_REF_NAME is a branch" >&2
            exit 1
          fi
          # Pre-releases spelled the way npm and PyPI order alike: SemVer's -1
          # would be a PyPI post-release.
          release_version='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(a|alpha|b|beta|c|rc|pre|preview|dev)([.]?(0|[1-9][0-9]*))?)?$'
          if [[ ! "$version" =~ $release_version ]]; then
            echo "::error::$version is not a registry-compatible SemVer release version" >&2
            exit 1
          fi
          npm_tag=latest
          [[ "$version" == *-* ]] && npm_tag=next
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "npm_tag=$npm_tag"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"

      # On a tag, the tag's set if it has one, else one built here; off a tag,
      # a dry run always builds.
      - name: where the set is
        id: where
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.what.outputs.tag }}
        run: |
          state=none
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            state=$(node scripts/release-publish.mjs state --tag "$TAG" --repo "$GITHUB_REPOSITORY")
          fi
          echo "$TAG: $state"
          case "$state" in
            none) echo "build=true" >> "$GITHUB_OUTPUT" ;;
            stored | published) echo "build=false" >> "$GITHUB_OUTPUT" ;;
            unfinished)
              echo "::error::the draft of $TAG holds part of a set and no manifest: storing it did not finish. Re-run the failed jobs of the run that built it while its artifact lasts; otherwise delete the draft, from which nothing was published, and run the release again." >&2
              exit 1 ;;
            *)
              echo "::error::$TAG has no release, and npm or PyPI has its version: a set was published from and is gone. A version is never built twice; tag the next one." >&2
              exit 1 ;;
          esac

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.where.outputs.build == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.where.outputs.build == 'true'
        with:
          python-version: '3.13'

      # Nothing is built that has not passed the gates a push to main passes:
      # a release is the worst moment to find a test failing.
      - run: go vet ./...
        if: steps.where.outputs.build == 'true'
      - run: go test -race -timeout 8m ./...
        if: steps.where.outputs.build == 'true'
      - run: make cover
        if: steps.where.outputs.build == 'true'
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
        if: steps.where.outputs.build == 'true'
      - run: govulncheck ./...
        if: steps.where.outputs.build == 'true'
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        if: steps.where.outputs.build == 'true'
        with:
          version: v2.13.2
      - run: npm test
        if: steps.where.outputs.build == 'true'
        working-directory: node
      - run: pip install -e 'python[test]' build wheel
        if: steps.where.outputs.build == 'true'
      - run: python -m coverage run -m pytest -q && python -m coverage report
        if: steps.where.outputs.build == 'true'
        working-directory: python
      - run: make wrapper-smoke
        if: steps.where.outputs.build == 'true'
      - run: make release-test
        if: steps.where.outputs.build == 'true'
      - run: node scripts/check-examples.mjs
        if: steps.where.outputs.build == 'true'
      # Go formatted and tidy, the stylesheet and the notices as their sources
      # make them: a release would ship stale notices with every binary.
      - run: make generated-check
        if: steps.where.outputs.build == 'true'
      - run: make workflows-check
        if: steps.where.outputs.build == 'true'

      - name: build the set
        if: steps.where.outputs.build == 'true'
        env:
          VERSION: ${{ steps.what.outputs.version }}
        run: node scripts/release-build.mjs --version "$VERSION" --commit "$GITHUB_SHA" --out set --python python

      - name: take the set the tag has
        if: steps.where.outputs.build == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.what.outputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir set

      # Whole, as its manifest says, and built from this commit: a set of
      # another commit is not this release's, whatever its name.
      - name: the set is whole, and this commit's
        env:
          VERSION: ${{ steps.what.outputs.version }}
        run: node scripts/release-set.mjs verify --dir set --version "$VERSION" --commit "$GITHUB_SHA"
      - name: its identity
        id: identity
        run: |
          identity=$(node scripts/release-set.mjs digest --dir set)
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      # How the set crosses to this run's other jobs. The store that outlasts
      # the run is the draft; this artifact is made again from it by any run
      # after.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-set
          if-no-files-found: error
          retention-days: 7
          path: set/

  go-platforms:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -timeout 5m ./...

  package-smoke:
    timeout-minutes: 15
    needs: set
    # The set's own archive, npm package and wheel, installed and run on every
    # machine a runner is, and on the oldest Node.js and Python the packages
    # support as well as the newest: exactly the files to be published.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '20.12', python: '3.9' }
          - { os: ubuntu-latest, node: '24', python: '3.13' }
          - { os: ubuntu-24.04-arm, node: '24', python: '3.13' }
          - { os: macos-latest, node: '24', python: '3.13' }
          - { os: windows-latest, node: '24', python: '3.13' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-set
          path: set
      - name: install and run what this machine gets
        shell: bash
        env:
          VERSION: ${{ needs.set.outputs.version }}
        run: |
          node scripts/release-set.mjs verify --dir set --version "$VERSION" --commit "$GITHUB_SHA"
          node scripts/check-release-packages.mjs --version "$VERSION" --set set --python python

  store:
    timeout-minutes: 15
    needs: [set, go-platforms, package-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-set
          path: set
      - name: the set checked is the set to store
        env:
          VERSION: ${{ needs.set.outputs.version }}
          IDENTITY: ${{ needs.set.outputs.identity }}
        run: |
          node scripts/release-set.mjs verify --dir set --version "$VERSION" --commit "$GITHUB_SHA"
          test "$(node scripts/release-set.mjs digest --dir set)" = "$IDENTITY"

      # Provenance for every file of the set, signed for this workflow, this
      # commit and this run, once: by the run that built it. Whoever downloads
      # one checks it with `gh attestation verify FILE --repo OWNER/NAME`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: needs.set.outputs.built == 'true' && needs.set.outputs.dry_run == 'false'
        with:
          subject-checksums: set/SHA256SUMS

      # The draft takes only what it lacks, never over what it has: a file
      # there with another digest stops the release. Its manifest goes last,
      # so that a draft holding one holds the whole set.
      - name: store the set in the tag's draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.set.outputs.tag }}
          DRY_RUN: ${{ needs.set.outputs.dry_run }}
        run: |
          dry=()
          [ "$DRY_RUN" = true ] && dry=(--dry-run)
          node scripts/release-publish.mjs github --dir set --tag "$TAG" --repo "$GITHUB_REPOSITORY" "${dry[@]}"

  reference:
    timeout-minutes: 5
    needs: set
    runs-on: ubuntu-latest
    outputs:
      gates: ${{ steps.gates.outputs.gates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # One gate for each build the reference names. No reference, or one that
      # names no build, stops the release here: it is never published on the
      # word of another browser.
      - name: the builds of the reference
        id: gates
        run: |
          gates=$(node scripts/release-set.mjs gates --reference reference/chrome.json)
          echo "gates=$gates" >> "$GITHUB_OUTPUT"

  pinned:
    timeout-minutes: 30
    needs: [set, reference, store]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.reference.outputs.gates) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      RESULT: ${{ matrix.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-set
          path: set

      # A result the draft holds already passed, for this commit and this set:
      # only a passed one is kept there, and the publishing jobs check it again.
      - name: a result held already
        id: held
        shell: bash
        run: |
          if [ -f "set/$RESULT" ]; then echo "held=true"; else echo "held=false"; fi >> "$GITHUB_OUTPUT"

      - name: restore the reference from the archive
        if: steps.held.outputs.held == 'false'
        shell: bash
        env:
          PINNED_ARCHIVE_URL: ${{ secrets.PINNED_ARCHIVE_URL }}
          PINNED_ARCHIVE_TOKEN: ${{ secrets.PINNED_ARCHIVE_TOKEN }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: >-
          node scripts/pinned-restore.mjs --reference reference/chrome.json --platform "$PLATFORM" --arch "$ARCH"
          --archive "$RUNNER_TEMP/archive" --installed "$RUNNER_TEMP/installed"

      - name: hold the profile to the reference
        if: steps.held.outputs.held == 'false'
        shell: bash
        env:
          IDENTITY: ${{ needs.set.outputs.identity }}
        run: |
          gate=(go run ./internal/pinned --manifest reference/chrome.json --archive "$RUNNER_TEMP/archive"
            --installed "$RUNNER_TEMP/installed" --commit "$GITHUB_SHA" --set "$IDENTITY" --out "set/$RESULT")
          # A Linux runner has no display, and the reference runs as it was
          # measured, which is with a window unless its launch says otherwise.
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "${gate[@]}"; else "${gate[@]}"; fi

      - name: keep the result beside the set
        if: steps.held.outputs.held == 'false' && needs.set.outputs.dry_run == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.set.outputs.tag }}
        run: gh release upload "$TAG" "set/$RESULT" --repo "$GITHUB_REPOSITORY"

      # For the publishing jobs, and to read when the gate failed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: pinned-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: ignore
          retention-days: 7
          path: set/${{ matrix.result }}

  # What a release would publish, asked of each registry and published nowhere.
  plan:
    timeout-minutes: 10
    needs: [set, store]
    if: needs.set.outputs.dry_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-set
          path: set
      - name: what npm and PyPI would be given
        env:
          VERSION: ${{ needs.set.outputs.version }}
          NPM_TAG: ${{ needs.set.outputs.npm_tag }}
        run: |
          node scripts/release-publish.mjs npm --dry-run --dir set --version "$VERSION" --tag "$NPM_TAG"
          node scripts/release-publish.mjs pypi --dry-run --dir set --version "$VERSION" --out upload

  publish-npm:
    timeout-minutes: 15
    needs: [set, store, pinned]
    if: needs.set.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/tls-forge
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-set
          path: set
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pinned-*
          merge-multiple: true
          path: set
      - name: the set stored, gated for this commit and this set
        env:
          VERSION: ${{ needs.set.outputs.version }}
          IDENTITY: ${{ needs.set.outputs.identity }}
        run: |
          node scripts/release-set.mjs verify --dir set --version "$VERSION" --commit "$GITHUB_SHA" --reference reference/chrome.json
          test "$(node scripts/release-set.mjs digest --dir set)" = "$IDENTITY"

      # The platform packages first, the one that pins them by exact version
      # last; what npm has with the same integrity is passed over, and one it
      # has with another stops the release. NPM_TOKEN creates packages that do
      # not exist yet; once trusted publishing is configured for each, npm
      # prefers OIDC and the secret can be deleted.
      - name: publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.set.outputs.version }}
          NPM_TAG: ${{ needs.set.outputs.npm_tag }}
        run: node scripts/release-publish.mjs npm --dir set --version "$VERSION" --tag "$NPM_TAG"

  publish-pypi:
    timeout-minutes: 15
    needs: [set, store, pinned]
    if: needs.set.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/tls-forge/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-set
          path: set
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pinned-*
          merge-multiple: true
          path: set
      - name: the set stored, gated for this commit and this set
        env:
          VERSION: ${{ needs.set.outputs.version }}
          IDENTITY: ${{ needs.set.outputs.identity }}
        run: |
          node scripts/release-set.mjs verify --dir set --version "$VERSION" --commit "$GITHUB_SHA" --reference reference/chrome.json
          test "$(node scripts/release-set.mjs digest --dir set)" = "$IDENTITY"

      # PyPI refuses a file it has, so it is given only what it lacks, and a
      # file it has with another digest stops the release.
      - name: what PyPI lacks
        id: lacks
        env:
          VERSION: ${{ needs.set.outputs.version }}
        run: |
          node scripts/release-publish.mjs pypi --dir set --version "$VERSION" --out upload
          echo "count=$(find upload -type f | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      # PyPI checks this job's short-lived OIDC token against the publisher
      # configured on the project, so no API token is stored, and the action
      # publishes attestations for the files it uploads.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        if: steps.lacks.outputs.count != '0'
        with:
          packages-dir: upload

  finish:
    timeout-minutes: 10
    needs: [set, publish-npm, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-set
          path: set
      # The draft is held to the set once more, and then published: the tap
      # and the image point at its files.
      - name: publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.set.outputs.tag }}
        run: |
          node scripts/release-publish.mjs github --dir set --tag "$TAG" --repo "$GITHUB_REPOSITORY"
          node scripts/release-publish.mjs finish --tag "$TAG" --repo "$GITHUB_REPOSITORY"

  homebrew:
    timeout-minutes: 15
    needs: [set, finish]
    # A stable formula is a stable channel: a release candidate must not
    # replace what `brew install tls-forge` installs.
    if: needs.set.outputs.npm_tag == 'latest'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-set
          path: set
      - name: update the homebrew tap
        env:
          # A token of its own: the workflow's cannot write to another
          # repository. A stable release is not whole without its formula, so
          # a missing secret fails, rather than a green release brew cannot
          # install.
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.set.outputs.version }}
          IDENTITY: ${{ needs.set.outputs.identity }}
        run: |
          test "$(node scripts/release-set.mjs digest --dir set)" = "$IDENTITY"
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set; cannot publish Formula/tls-forge.rb"
            exit 1
          fi
          tap="$RUNNER_TEMP/tap"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/Sec-CH-Lemon/homebrew-tap.git" "$tap"
          mkdir -p "$tap/Formula"
          # This formula, one of a later version that a retried release must
          # not take back, or another of this version, which stops it.
          decision=$(node scripts/release-publish.mjs homebrew --formula set/tls-forge.rb --tap "$tap/Formula/tls-forge.rb")
          echo "formula: $decision"
          [ "$decision" = write ] || exit 0
          cp set/tls-forge.rb "$tap/Formula/tls-forge.rb"
          cd "$tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/tls-forge.rb
          git commit -m "tls-forge $VERSION"
          git push

  image:
    timeout-minutes: 45
    needs: [set, finish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Needed only by the check at the end: the runner is amd64, so running the
      # arm64 image to prove it works means emulating it. The build itself does
      # not use QEMU, it cross-compiles.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The workflow's own token is enough for the registry attached to this
          # repository, so there is no secret to create or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          # Lower-cased by the action: the repository name has capitals and the
          # registry does not accept them.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # latest=auto leaves `latest` where it is for a pre-release tag, so
          # v1.0.0-rc1 does not become what everyone pulls by default.
          flavor: latest=auto

      # The version's image is built once, as its set is: a release run again
      # after it was pushed leaves it as it is.
      - name: the version's image, if the registry has it
        id: had
        env:
          VERSION: ${{ needs.set.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION"
          if docker buildx imagetools inspect "$image" > /dev/null 2>&1; then
            echo "$image is pushed already"
            echo "had=true" >> "$GITHUB_OUTPUT"
          else
            echo "had=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.had.outputs.had == 'false'
        with:
          context: .
          # Cross-compiled rather than emulated: the builder stage is pinned to
          # the runner's own platform and Go targets the other one.
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Pulled back from the registry and run. Pushing an image that cannot
      # start is worse than not pushing one, because it looks like a release.
      - name: the published image runs
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image=$(echo "$TAGS" | head -1)
          for platform in linux/amd64 linux/arm64; do
            echo "checking $platform"
            docker run --rm --platform "$platform" --pull always "$image" version
          done
