name: release

# Publishing is driven by a tag, so the version has exactly one source. Nothing
# here reads a version out of a committed file: the tag is it, and the packages
# are stamped from it.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm_tag: ${{ steps.version.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: read the version from the tag
        id: version
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          # Restrict pre-releases to spellings that npm and PyPI classify the
          # same way. In particular, SemVer's "-1" becomes a PyPI post-release.
          release_version='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(a|alpha|b|beta|c|rc|pre|preview|dev)([.]?(0|[1-9][0-9]*))?)?$'
          if [[ ! "$version" =~ $release_version ]]; then
            echo "tag $GITHUB_REF_NAME is not a registry-compatible SemVer release tag" >&2
            exit 1
          fi

          npm_tag=latest
          [[ "$version" == *-* ]] && npm_tag=next
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"

      # Nothing gets published that has not passed the same gates as a push.
      # A release is the worst moment to find out a test was failing.
      - run: go vet ./...
      - run: go test -race -timeout 5m ./...
      - run: make cover
      - run: npm test
        working-directory: node
      - run: pip install -e 'python[test]' build wheel
      - run: python -m coverage run -m pytest -q
        working-directory: python
      - run: python -m coverage report
        working-directory: python

      # The published binaries carry every dependency inside them, and those
      # licences require their notices to travel along. If the committed notices
      # are stale, the release would ship the wrong ones.
      - name: third-party notices are current
        run: |
          make notices
          git diff --exit-code THIRD-PARTY-NOTICES.txt \
            || { echo "THIRD-PARTY-NOTICES.txt is stale; run 'make notices' and commit"; exit 1; }

      - name: cross-compile
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist/bin
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/amd64; do
            goos=${target%/*}
            goarch=${target#*/}
            output="dist/bin/tls-forge-$goos-$goarch"
            [ "$goos" = windows ] && output="$output.exe"
            echo "building $output"
            GOOS=$goos GOARCH=$goarch go build \
              -trimpath -ldflags "-s -w -X main.version=v$VERSION" \
              -o "$output" ./cmd/tls-forge
          done

      # A binary that cannot run is not worth publishing, and this runner can at
      # least run its own.
      - name: the linux binary works
        run: |
          chmod +x dist/bin/tls-forge-linux-amd64
          ./dist/bin/tls-forge-linux-amd64 version
          ./dist/bin/tls-forge-linux-amd64 profiles > /dev/null

      # Tarballs, not bare binaries. Whoever downloads a release asset gets the
      # licence notices in the same archive as the thing they have to accompany;
      # a loose binary next to a loose LICENSE relies on people picking up both.
      - name: package the release archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist/release
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/amd64; do
            goos=${target%/*}
            goarch=${target#*/}
            src="dist/bin/tls-forge-$goos-$goarch"
            exe=tls-forge
            if [ "$goos" = windows ]; then
              src="$src.exe"
              exe=tls-forge.exe
            fi
            staging=$(mktemp -d)
            cp "$src" "$staging/$exe"
            chmod +x "$staging/$exe"
            cp LICENSE NOTICE THIRD-PARTY-NOTICES.txt README.md "$staging/"
            tar -czf "dist/release/tls-forge_${VERSION}_${goos}_${goarch}.tar.gz" -C "$staging" .
          done
          ls -l dist/release

      - name: assemble the npm packages
        run: node scripts/npm-release.mjs --version "${{ steps.version.outputs.version }}" --binaries dist/bin --out dist/npm

      - name: pack the npm packages
        run: |
          mkdir -p dist/npm-packages
          for pkg in dist/npm/tls-forge-*; do
            npm pack "$pkg" --pack-destination dist/npm-packages --ignore-scripts
          done
          npm pack dist/npm/tls-forge --pack-destination dist/npm-packages --ignore-scripts

      - name: the linux npm packages install and work
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          main=$(realpath "dist/npm-packages/tls-forge-${VERSION}.tgz")
          platform=$(realpath "dist/npm-packages/sec-ch-lemon-tls-forge-linux-x64-${VERSION}.tgz")
          check=$(mktemp -d)
          cd "$check"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund \
            "$main" "$platform"
          node --input-type=module -e \
            "import { Client } from 'tls-forge'; const client = new Client(); client.close();"
          ./node_modules/@sec-ch-lemon/tls-forge-linux-x64/bin/tls-forge version

      # One wheel per platform, each with its binary inside. The script refuses
      # to produce a wheel that is missing the binary, has it without its exec
      # bit, or lacks the licence notices — three ways to ship something that
      # installs and then does not work.
      - name: assemble the python distributions
        run: python scripts/pypi-release.py --version "${{ steps.version.outputs.version }}" --binaries dist/bin --out dist/pypi

      # Installed from the wheel and run, the way `the published image runs`
      # does for Docker. The runner is linux/amd64, so that is the wheel it can
      # prove; the rest are proved by the checks above and by their tags.
      - name: the linux wheel installs and works
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --no-index \
            dist/pypi/*manylinux2014_x86_64*.whl
          /tmp/wheelcheck/bin/python -c "
          import tlsforge, subprocess
          binary = tlsforge.resolve_binary()
          print(binary)
          completed = subprocess.run([binary, 'version'], capture_output=True, text=True)
          print(completed.stdout.strip())
          assert completed.returncode == 0, completed.stderr
          assert tlsforge.__version__ == '${{ steps.version.outputs.version }}', tlsforge.__version__
          "

      - name: generate the homebrew formula
        run: |
          node scripts/homebrew-formula.mjs \
            --version "${{ steps.version.outputs.version }}" \
            --archives dist/release > dist/tls-forge.rb
          cat dist/tls-forge.rb

      # Publish jobs receive only these already-tested files. In particular,
      # npm packages cross the job boundary as tarballs: upload-artifact does
      # not preserve executable modes on loose files, while a tarball does.
      - name: save the release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          if-no-files-found: error
          retention-days: 2
          path: |
            dist/npm-packages/*.tgz
            dist/pypi/*
            dist/release/*
            dist/tls-forge.rb
            LICENSE
            NOTICE
            THIRD-PARTY-NOTICES.txt

  package-smoke:
    timeout-minutes: 15
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
      # Install and execute the exact tarballs and wheels that are about to be
      # published on every supported OS. A tag does not trigger ci.yml's
      # branch-filtered jobs, so the release must carry this gate itself.
      - run: node scripts/check-release-packages.mjs --version "${{ needs.build.outputs.version }}" --dist dist --python python

  publish-npm:
    timeout-minutes: 15
    needs: [build, package-smoke]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/tls-forge
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts

      # The platform packages go first. The main package pins them by exact
      # version, so publishing it first would leave a window in which installing
      # it resolves nothing. NPM_TOKEN bootstraps packages that do not exist yet;
      # after Trusted Publishing is configured npm prefers OIDC automatically
      # and the secret can be deleted.
      - name: publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ needs.build.outputs.npm_tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for pkg in dist/npm-packages/sec-ch-lemon-tls-forge-*.tgz; do
            echo "publishing $pkg"
            npm publish "$pkg" --access public --provenance \
              --tag "$NPM_TAG"
          done
          npm publish "dist/npm-packages/tls-forge-${VERSION}.tgz" \
            --access public --provenance --tag "$NPM_TAG"

  publish-pypi:
    timeout-minutes: 15
    needs: [build, package-smoke]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/tls-forge/
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts

      # PyPI verifies this job's short-lived OIDC token against the publisher
      # configured on the project. No API token is created or stored, and the
      # action publishes attestations for the uploaded files automatically.
      - name: publish to pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pypi

  github-release:
    timeout-minutes: 15
    needs: [build, publish-npm, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts

      # The release has to exist before the tap points at it: the formula
      # carries the download URL and the checksum, and a tap that referenced a
      # missing asset would break `brew install` for everyone.
      - name: create the github release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${prerelease[@]}" \
            dist/release/* LICENSE NOTICE THIRD-PARTY-NOTICES.txt

  homebrew:
    timeout-minutes: 15
    needs: [build, github-release]
    # A stable formula is a stable channel: release candidates must not replace
    # what `brew install tls-forge` installs by default.
    if: needs.build.outputs.npm_tag == 'latest'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts

      - name: update the homebrew tap
        env:
          # A separate token: the workflow's own GITHUB_TOKEN cannot write to
          # another repository. Without the secret this step says so and stops,
          # rather than failing a release that has already published everything
          # else.
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set — skipping the tap update."
            echo "The formula is at dist/tls-forge.rb; copy it into the tap by hand."
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/Sec-CH-Lemon/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp dist/tls-forge.rb tap/Formula/tls-forge.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/tls-forge.rb
          git diff --cached --quiet && { echo "formula unchanged"; exit 0; }
          git commit -m "tls-forge $VERSION"
          git push

  image:
    timeout-minutes: 45
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v7
      # Needed only by the check at the end: the runner is amd64, so running the
      # arm64 image to prove it works means emulating it. The build itself does
      # not use QEMU, it cross-compiles.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The workflow's own token is enough for the registry attached to this
          # repository, so there is no secret to create or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          # Lower-cased by the action: the repository name has capitals and the
          # registry does not accept them.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # latest=auto leaves `latest` where it is for a pre-release tag, so
          # v1.0.0-rc1 does not become what everyone pulls by default.
          flavor: latest=auto

      - uses: docker/build-push-action@v7
        with:
          context: .
          # Cross-compiled rather than emulated: the builder stage is pinned to
          # the runner's own platform and Go targets the other one.
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Pulled back from the registry and run. Pushing an image that cannot
      # start is worse than not pushing one, because it looks like a release.
      - name: the published image runs
        run: |
          image=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          for platform in linux/amd64 linux/arm64; do
            echo "checking $platform"
            docker run --rm --platform "$platform" --pull always "$image" version
          done
