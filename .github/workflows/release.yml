name: release

# Publishing is driven by a tag, so the version has exactly one source. Nothing
# here reads a version out of a committed file: the tag is it, and the packages
# are stamped from it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release and attach the binaries
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: read the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Nothing gets published that has not passed the same gates as a push.
      # A release is the worst moment to find out a test was failing.
      - run: go vet ./...
      - run: go test -race ./...
      - run: make cover
      - run: node --test 'test/*.test.js'
        working-directory: node

      # The published binaries carry every dependency inside them, and those
      # licences require their notices to travel along. If the committed notices
      # are stale, the release would ship the wrong ones.
      - name: third-party notices are current
        run: |
          make notices
          git diff --exit-code THIRD-PARTY-NOTICES.txt \
            || { echo "THIRD-PARTY-NOTICES.txt is stale; run 'make notices' and commit"; exit 1; }

      - name: cross-compile
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist/bin
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/amd64; do
            goos=${target%/*}
            goarch=${target#*/}
            output="dist/bin/tls-forge-$goos-$goarch"
            [ "$goos" = windows ] && output="$output.exe"
            echo "building $output"
            GOOS=$goos GOARCH=$goarch go build \
              -trimpath -ldflags "-s -w -X main.version=v$VERSION" \
              -o "$output" ./cmd/tls-forge
          done

      # A binary that cannot run is not worth publishing, and this runner can at
      # least run its own.
      - name: the linux binary works
        run: |
          chmod +x dist/bin/tls-forge-linux-amd64
          ./dist/bin/tls-forge-linux-amd64 version
          ./dist/bin/tls-forge-linux-amd64 profiles > /dev/null

      # Tarballs, not bare binaries. Whoever downloads a release asset gets the
      # licence notices in the same archive as the thing they have to accompany;
      # a loose binary next to a loose LICENSE relies on people picking up both.
      - name: package the release archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist/release
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/amd64; do
            goos=${target%/*}
            goarch=${target#*/}
            src="dist/bin/tls-forge-$goos-$goarch"
            exe=tls-forge
            if [ "$goos" = windows ]; then
              src="$src.exe"
              exe=tls-forge.exe
            fi
            staging=$(mktemp -d)
            cp "$src" "$staging/$exe"
            chmod +x "$staging/$exe"
            cp LICENSE NOTICE THIRD-PARTY-NOTICES.txt README.md "$staging/"
            tar -czf "dist/release/tls-forge_${VERSION}_${goos}_${goarch}.tar.gz" -C "$staging" .
          done
          ls -l dist/release

      - name: assemble the npm packages
        run: node scripts/npm-release.mjs --version "${{ steps.version.outputs.version }}" --binaries dist/bin --out dist/npm

      - name: generate the homebrew formula
        run: |
          node scripts/homebrew-formula.mjs \
            --version "${{ steps.version.outputs.version }}" \
            --archives dist/release > dist/tls-forge.rb
          cat dist/tls-forge.rb

      # The platform packages go first. The main package pins them by exact
      # version, so publishing it first would leave a window in which installing
      # it resolves nothing.
      - name: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in dist/npm/tls-forge-*; do
            echo "publishing $pkg"
            npm publish "$pkg" --access public --provenance
          done
          npm publish dist/npm/tls-forge --access public --provenance

      # The release has to exist before the tap points at it: the formula
      # carries the download URL and the checksum, and a tap that referenced a
      # missing asset would break `brew install` for everyone.
      - name: github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/release/* LICENSE NOTICE THIRD-PARTY-NOTICES.txt

      - name: update the homebrew tap
        env:
          # A separate token: the workflow's own GITHUB_TOKEN cannot write to
          # another repository. Without the secret this step says so and stops,
          # rather than failing a release that has already published everything
          # else.
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set — skipping the tap update."
            echo "The formula is at dist/tls-forge.rb; copy it into the tap by hand."
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/Sec-CH-Lemon/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp dist/tls-forge.rb tap/Formula/tls-forge.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/tls-forge.rb
          git diff --cached --quiet && { echo "formula unchanged"; exit 0; }
          git commit -m "tls-forge $VERSION"
          git push
